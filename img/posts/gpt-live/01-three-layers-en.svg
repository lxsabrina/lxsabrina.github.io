<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>The three-layer architecture of a voice agent</title><desc>The user talks to the Voice Interface (GPT-Live) in real time; when decisions and tools are needed it delegates to the Agent Runtime; actions that truly change business state are executed by the Business Execution layer under permission, confirmation and recording constraints.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" rx="10" fill="#FFFFFF"/><rect x="40" y="24" width="120" height="56" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="100.0" y="43.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">User</text><text x="100.0" y="63.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Phone / app / web</text><line x1="162" y1="46" x2="196" y2="46" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="196" y1="60" x2="162" y2="60" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="179" y="32" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Audio</text><rect x="200" y="16" width="440" height="120" rx="12" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="220" y="38" font-size="14" fill="#3C3489" font-weight="500" text-anchor="start" dominant-baseline="central">Voice Interface: understanding and communication</text><text x="220" y="62" font-size="12" fill="#534AB7" font-weight="400" text-anchor="start" dominant-baseline="central">GPT-Live: listens and speaks; handles interruptions</text><text x="220" y="84" font-size="12" fill="#534AB7" font-weight="400" text-anchor="start" dominant-baseline="central">Decides when to delegate; says results in natural speech</text><text x="220" y="106" font-size="12" fill="#534AB7" font-weight="400" text-anchor="start" dominant-baseline="central">No direct calls to business systems</text><line x1="420" y1="138" x2="420" y2="168" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="450" y1="168" x2="450" y2="138" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="410" y="154" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">Delegate</text><text x="460" y="154" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Result</text><rect x="200" y="170" width="440" height="120" rx="12" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="220" y="192" font-size="14" fill="#085041" font-weight="500" text-anchor="start" dominant-baseline="central">Agent Runtime: decisions and tools</text><text x="220" y="216" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">Reasoning model + tools + session state + SOP / business rules</text><text x="220" y="238" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">Can be hosted Responses or your own agent</text><text x="220" y="260" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">Swappable: fast model for frequent tasks, strong model for hard ones</text><line x1="420" y1="292" x2="420" y2="322" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="450" y1="322" x2="450" y2="292" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="410" y="308" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">Action</text><text x="460" y="308" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Result</text><rect x="200" y="324" width="440" height="104" rx="12" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="220" y="346" font-size="14" fill="#712B13" font-weight="500" text-anchor="start" dominant-baseline="central">Business Execution: business outcomes</text><text x="220" y="370" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Real systems: CRM, orders, tickets, payments</text><text x="220" y="392" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Permission checks, user confirmation, idempotent execution, audit trail</text><text x="220" y="414" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Owned by your application, not handed to any model</text><text x="100" y="200" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Most of the value</text><text x="100" y="220" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">is in the two lower layers</text><path d="M100 234 L100 376 L196 376" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/><text x="340" y="452" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">The voice layer decides the experience; the two lower layers decide whether the task is truly done correctly</text></svg>
