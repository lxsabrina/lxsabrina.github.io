<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Conversation timelines of half duplex and full duplex</title><desc>A cascaded turn-taking system waits for the user to finish, then goes through recognition, reasoning and synthesis before speaking; a full-duplex model listens and speaks on one timeline, can backchannel, can be interrupted, and keeps talking while background tasks run.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="340" rx="10" fill="#FFFFFF"/><text x="40" y="24" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Turn-taking (cascade: ASR → LLM → TTS)</text><text x="40" y="53" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">User</text><line x1="110" y1="53" x2="640" y2="53" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><text x="40" y="89" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Agent</text><line x1="110" y1="89" x2="640" y2="89" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><rect x="110" y="40" width="190" height="26" rx="4" fill="#5F5E5A" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="205.0" y="53" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">User finishes a full sentence</text><rect x="300" y="76" width="110" height="26" rx="4" fill="#F1EFE8" fill-opacity="1" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="3 3"/><text x="355" y="89" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">ASR + LLM + TTS</text><rect x="410" y="76" width="190" height="26" rx="4" fill="#534AB7" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="505.0" y="89" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">Reply (finish or hard cut)</text><rect x="470" y="40" width="50" height="26" rx="4" fill="#5F5E5A" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="495.0" y="53" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">Cut in</text><text x="495" y="124" font-size="11" fill="#D85A30" font-weight="400" text-anchor="middle" dominant-baseline="central">Interruptions are often treated as noise or cause a hard cut</text><text x="40" y="164" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Full duplex (GPT-Live)</text><text x="40" y="193" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">User</text><line x1="110" y1="193" x2="640" y2="193" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><text x="40" y="229" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Agent</text><line x1="110" y1="229" x2="640" y2="229" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><text x="40" y="265" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Background agent</text><line x1="110" y1="265" x2="640" y2="265" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><rect x="110" y="180" width="180" height="26" rx="4" fill="#5F5E5A" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="200.0" y="193" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">User speaking</text><rect x="200" y="216" width="36" height="26" rx="4" fill="#1D9E75" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="218.0" y="229" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">mm</text><rect x="300" y="216" width="120" height="26" rx="4" fill="#534AB7" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="360.0" y="229" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">Ack, then "checking"</text><rect x="330" y="252" width="190" height="26" rx="4" fill="#0F6E56" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="425.0" y="265" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">Delegated task running (tools)</text><rect x="440" y="180" width="50" height="26" rx="4" fill="#5F5E5A" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="465.0" y="193" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">Add</text><rect x="500" y="216" width="130" height="26" rx="4" fill="#534AB7" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="565.0" y="229" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">Continue with result</text><text x="218" y="270" font-size="11" fill="#1D9E75" font-weight="400" text-anchor="middle" dominant-baseline="central">Backchannel</text><text x="465" y="168" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Cut in at any time</text><text x="340" y="316" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Full duplex: input and output run in parallel on one timeline, in one model</text></svg>
