<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Client Delegation 的事件时序</title><desc>用户、GPT-Live、你的应用、你的 Agent Runtime 四条泳道：委托创建、应用自行维护转写上下文、Agent 执行工具、通过 commentary 与 thinking 追加结果、GPT-Live 用口语说出。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="560" rx="10" fill="#FFFFFF"/><rect x="38" y="20" width="124" height="36" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="100.0" y="38.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">用户</text><line x1="100" y1="58" x2="100" y2="536" stroke="#D3D1C7" stroke-width="1" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="198" y="20" width="124" height="36" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="260.0" y="38.0" font-size="13" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">GPT-Live</text><line x1="260" y1="58" x2="260" y2="536" stroke="#D3D1C7" stroke-width="1" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="358" y="20" width="124" height="36" rx="8" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="420.0" y="38.0" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">你的应用</text><line x1="420" y1="58" x2="420" y2="536" stroke="#D3D1C7" stroke-width="1" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="508" y="20" width="124" height="36" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="570.0" y="38.0" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Agent Runtime</text><line x1="570" y1="58" x2="570" y2="536" stroke="#D3D1C7" stroke-width="1" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="106" y1="92" x2="254" y2="92" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="108.3" y="73" width="143.4" height="18" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="180.0" y="82" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">“帮我查一下保单能不能退”</text><line x1="266" y1="132" x2="414" y2="132" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="161.4" y="113" width="357.2" height="18" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="340.0" y="122" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">session.input_transcript.delta / output_transcript.delta</text><rect x="320.0" y="151" width="200" height="26" rx="4" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.6"/><text x="420" y="164" font-size="11" fill="#712B13" font-weight="400" text-anchor="middle" dominant-baseline="central">应用自己拼接对话上下文</text><line x1="266" y1="204" x2="414" y2="204" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="198.7" y="185" width="282.6" height="18" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="340.0" y="194" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">session.delegation.created（id，不含任务文本）</text><line x1="254" y1="244" x2="106" y2="244" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="102.80000000000001" y="225" width="154.39999999999998" height="18" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="180.0" y="234" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">自动应答：“好的，我查一下”</text><line x1="426" y1="284" x2="564" y2="284" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="432.9" y="265" width="124.2" height="18" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="495.0" y="274" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">对话上下文 + 委托 id</text><rect x="485.0" y="303" width="170" height="26" rx="4" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.6"/><text x="570" y="316" font-size="11" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">推理 + 工具调用 + SOP</text><line x1="564" y1="356" x2="426" y2="356" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="440.5" y="337" width="109" height="18" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="495.0" y="346" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">结论、需确认的动作</text><line x1="414" y1="396" x2="266" y2="396" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="214.2" y="377" width="251.6" height="18" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="340.0" y="386" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">session.thinking.append（事实，暂不说出）</text><line x1="414" y1="436" x2="266" y2="436" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="208.0" y="417" width="264.0" height="18" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="340.0" y="426" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">session.commentary.append（可以说出的内容）</text><line x1="254" y1="476" x2="106" y2="476" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="87.0" y="457" width="186" height="18" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="180.0" y="466" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">用口语转述结果，必要时请用户确认</text><rect x="315.0" y="499" width="210" height="26" rx="4" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.6"/><text x="420" y="512" font-size="11" fill="#712B13" font-weight="400" text-anchor="middle" dominant-baseline="central">应用记录：做了什么、说了什么</text></svg>
