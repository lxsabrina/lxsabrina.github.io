<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>语音智能体的三层架构</title><desc>用户与 Voice Interface（GPT-Live）实时对话；需要决策和工具时委托给 Agent Runtime；真正改变业务状态的动作由 Business Execution 层在权限、确认和记录的约束下执行。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" rx="10" fill="#FFFFFF"/><rect x="40" y="24" width="120" height="56" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="100.0" y="43.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">用户</text><text x="100.0" y="63.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">电话 / App / 网页</text><line x1="162" y1="46" x2="196" y2="46" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="196" y1="60" x2="162" y2="60" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="179" y="32" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">音频</text><rect x="200" y="16" width="440" height="120" rx="12" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="220" y="38" font-size="14" fill="#3C3489" font-weight="500" text-anchor="start" dominant-baseline="central">Voice Interface：理解与沟通</text><text x="220" y="62" font-size="12" fill="#534AB7" font-weight="400" text-anchor="start" dominant-baseline="central">GPT-Live：边听边说，处理打断、附和与沉默</text><text x="220" y="84" font-size="12" fill="#534AB7" font-weight="400" text-anchor="start" dominant-baseline="central">决定何时委托；把结果用自然的口语说出来</text><text x="220" y="106" font-size="12" fill="#534AB7" font-weight="400" text-anchor="start" dominant-baseline="central">不直接调用业务系统</text><line x1="420" y1="138" x2="420" y2="168" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="450" y1="168" x2="450" y2="138" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="410" y="154" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">委托</text><text x="460" y="154" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">结果</text><rect x="200" y="170" width="440" height="120" rx="12" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="220" y="192" font-size="14" fill="#085041" font-weight="500" text-anchor="start" dominant-baseline="central">Agent Runtime：决策与工具</text><text x="220" y="216" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">推理模型 + 工具 + 会话状态 + SOP / 业务规则</text><text x="220" y="238" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">可以是 Responses 托管，也可以是你自己的 Agent</text><text x="220" y="260" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">可替换：快模型处理高频，强模型处理复杂问题</text><line x1="420" y1="292" x2="420" y2="322" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="450" y1="322" x2="450" y2="292" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="410" y="308" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">动作</text><text x="460" y="308" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">结果</text><rect x="200" y="324" width="440" height="104" rx="12" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="220" y="346" font-size="14" fill="#712B13" font-weight="500" text-anchor="start" dominant-baseline="central">Business Execution：业务结果</text><text x="220" y="370" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">CRM、订单、工单、支付等真实系统</text><text x="220" y="392" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">权限校验、用户确认、幂等执行、留痕审计</text><text x="220" y="414" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">由你的应用负责，不交给任何模型</text><text x="100" y="200" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">价值主要</text><text x="100" y="220" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">在下面两层</text><path d="M100 234 L100 376 L196 376" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/><text x="340" y="452" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">语音层决定体验，下面两层决定任务是否真的被正确完成</text></svg>
