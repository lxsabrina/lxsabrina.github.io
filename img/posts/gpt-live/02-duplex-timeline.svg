<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>半双工与全双工的对话时间线</title><desc>级联的轮流式系统要等用户说完、经过识别、推理、合成才开口；全双工模型在同一时间轴上同时听和说，可以附和、被打断，并在后台任务执行期间继续对话。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="340" rx="10" fill="#FFFFFF"/><text x="40" y="24" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">轮流式（级联：ASR → LLM → TTS）</text><text x="40" y="53" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">用户</text><line x1="110" y1="53" x2="640" y2="53" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><text x="40" y="89" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">智能体</text><line x1="110" y1="89" x2="640" y2="89" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><rect x="110" y="40" width="190" height="26" rx="4" fill="#5F5E5A" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="205.0" y="53" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">用户说完一整句</text><rect x="300" y="76" width="110" height="26" rx="4" fill="#F1EFE8" fill-opacity="1" stroke="#B4B2A9" stroke-width="0.6" stroke-dasharray="3 3"/><text x="355" y="89" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">识别 + 推理 + 合成</text><rect x="410" y="76" width="190" height="26" rx="4" fill="#534AB7" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="505.0" y="89" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">回复（被打断也要说完或硬切）</text><rect x="470" y="40" width="50" height="26" rx="4" fill="#5F5E5A" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="495.0" y="53" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">插话</text><text x="495" y="124" font-size="11" fill="#D85A30" font-weight="400" text-anchor="middle" dominant-baseline="central">插话常被当成噪声或导致硬切</text><text x="40" y="164" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">全双工（GPT-Live）</text><text x="40" y="193" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">用户</text><line x1="110" y1="193" x2="640" y2="193" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><text x="40" y="229" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">智能体</text><line x1="110" y1="229" x2="640" y2="229" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><text x="40" y="265" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">后台 Agent</text><line x1="110" y1="265" x2="640" y2="265" stroke="#D3D1C7" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><rect x="110" y="180" width="180" height="26" rx="4" fill="#5F5E5A" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="200.0" y="193" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">用户在说</text><rect x="200" y="216" width="36" height="26" rx="4" fill="#1D9E75" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="218.0" y="229" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">嗯</text><rect x="300" y="216" width="120" height="26" rx="4" fill="#534AB7" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="360.0" y="229" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">先回应，再说正在查</text><rect x="330" y="252" width="190" height="26" rx="4" fill="#0F6E56" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="425.0" y="265" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">委托任务执行中（工具调用）</text><rect x="440" y="180" width="50" height="26" rx="4" fill="#5F5E5A" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="465.0" y="193" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">补充</text><rect x="500" y="216" width="130" height="26" rx="4" fill="#534AB7" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="565.0" y="229" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">带着结果继续对话</text><text x="218" y="270" font-size="11" fill="#1D9E75" font-weight="400" text-anchor="middle" dominant-baseline="central">附和</text><text x="465" y="168" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">随时插话</text><text x="340" y="316" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">全双工的本质：输入和输出在同一时间轴上并行，由一个模型同时推理两路音频</text></svg>
