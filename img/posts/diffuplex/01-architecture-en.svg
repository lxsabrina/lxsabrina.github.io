<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" width="680" height="326" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Diffuplex inference structure</title><desc>Streaming speech enters a shared backbone; the autoregressive mode emits an interaction state every 80 ms and, on the start state, the diffusion mode generates the reply in parallel on a 256-token canvas, which goes to TTS.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="326" rx="10" fill="#FFFFFF"/><text x="340" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Diffuplex: AR decides when to speak, diffusion decides what</text><rect x="16" y="110" width="100" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="66.0" y="135.5" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Speech in</text><text x="66.0" y="154.5" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Encoder + proj.</text><line x1="118" y1="145" x2="142" y2="145" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="144" y="44" width="390" height="236" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="339" y="60" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">One backbone, two modes (shared weights)</text><rect x="160" y="78" width="150" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="235.0" y="106.5" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">AR mode</text><text x="235.0" y="125.5" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">state every 80 ms</text><rect x="368" y="78" width="150" height="76" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="443.0" y="106.5" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Diffusion mode</text><text x="443.0" y="125.5" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">256-token canvas</text><line x1="312" y1="106" x2="366" y2="106" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><text x="339" y="92" font-size="11" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">&lt;bos&gt;</text><line x1="366" y1="130" x2="312" y2="130" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><text x="339" y="144" font-size="11" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">&lt;eos&gt;</text><rect x="160" y="184" width="358" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="339.0" y="204.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Each path keeps its own KV cache</text><text x="339" y="252" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">First 8 tokens are frozen after at most K passes; TTS can start early</text><line x1="536" y1="145" x2="562" y2="145" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="564" y="110" width="100" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="614.0" y="135.5" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">TTS</text><text x="614.0" y="154.5" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">CosyVoice 3</text><text x="614" y="200" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Speech out</text><text x="340" y="304" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">States: listen / speak / bos / eos</text></svg>