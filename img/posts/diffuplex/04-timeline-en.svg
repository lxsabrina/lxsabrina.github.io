<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Timeline of one reply</title><desc>While the user speaks the AR policy emits listen every 80 ms; after the user stops it emits bos, which starts diffusion; once the first 8 tokens are committed TTS starts playing while diffusion keeps denoising; during playback the AR policy keeps listening and can emit eos to cut playback.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="330" rx="10" fill="#FFFFFF"/><text x="340" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Listening and speaking run side by side, joined by bos / eos</text><text x="120" y="62" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="end" dominant-baseline="central">User speech</text><line x1="130" y1="62" x2="664" y2="62" stroke="#E5E3DA" stroke-width="0.8"/><text x="120" y="112" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="end" dominant-baseline="central">AR state</text><line x1="130" y1="112" x2="664" y2="112" stroke="#E5E3DA" stroke-width="0.8"/><text x="120" y="172" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="end" dominant-baseline="central">Diffusion</text><line x1="130" y1="172" x2="664" y2="172" stroke="#E5E3DA" stroke-width="0.8"/><text x="120" y="232" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="end" dominant-baseline="central">TTS playback</text><line x1="130" y1="232" x2="664" y2="232" stroke="#E5E3DA" stroke-width="0.8"/><rect x="130" y="50" width="170" height="24" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="215" y="62" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">"Weather tomorrow?"</text><rect x="132" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="152" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="172" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="192" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="212" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="232" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="252" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="272" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="292" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="312" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text x="215" y="134" font-size="11" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">listen (one per 80 ms)</text><rect x="320" y="100" width="36" height="24" rx="4" fill="#534AB7" stroke="#534AB7" stroke-width="0.8"/><text x="338" y="112" font-size="11" fill="#FFFFFF" font-weight="500" text-anchor="middle" dominant-baseline="central">bos</text><rect x="362" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="382" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="402" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="422" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="442" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="462" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="482" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="502" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="522" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="542" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="562" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="582" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="602" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text x="492.0" y="134" font-size="11" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">speak (still listening)</text><rect x="624" y="100" width="36" height="24" rx="4" fill="#534AB7" stroke="#534AB7" stroke-width="0.8"/><text x="642" y="112" font-size="11" fill="#FFFFFF" font-weight="500" text-anchor="middle" dominant-baseline="central">eos</text><line x1="338" y1="124" x2="380" y2="158" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/><rect x="360" y="160" width="80" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="400" y="172" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">≤K passes</text><rect x="446" y="160" width="170" height="24" rx="4" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/><text x="531.0" y="172" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">denoising until converged</text><line x1="440" y1="184" x2="440" y2="218" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/><text x="446" y="201" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">after the first 8 tokens are fixed</text><rect x="440" y="220" width="176" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="528.0" y="232" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">speaks while later tokens arrive</text><line x1="642" y1="124" x2="620" y2="218" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/><text x="638" y="160" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">cut</text><line x1="300" y1="266" x2="338" y2="266" stroke="#534AB7" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="294" y="266" font-size="11" fill="#534AB7" font-weight="400" text-anchor="end" dominant-baseline="central">① turn-decision delay</text><line x1="338" y1="286" x2="440" y2="286" stroke="#993C1D" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="448" y="286" font-size="11" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">② post-trigger: 296 ms at K=4</text><text x="340" y="316" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Time to first audio ≈ ① + ②; the paper's K sweep measures only ② (not to scale)</text></svg>