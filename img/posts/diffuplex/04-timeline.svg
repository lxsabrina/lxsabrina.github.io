<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>一次回复的时间线</title><desc>用户说话期间 AR 每 80 ms 输出 listen；用户停下后输出 bos，触发扩散生成；前 8 个 token 固定后 TTS 开始播放，扩散继续去噪；播放期间 AR 继续监听，可输出 eos 截断。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="330" rx="10" fill="#FFFFFF"/><text x="340" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">听和说是两条并存的路径，通过 bos / eos 衔接</text><text x="120" y="62" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="end" dominant-baseline="central">用户语音</text><line x1="130" y1="62" x2="664" y2="62" stroke="#E5E3DA" stroke-width="0.8"/><text x="120" y="112" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="end" dominant-baseline="central">AR 状态</text><line x1="130" y1="112" x2="664" y2="112" stroke="#E5E3DA" stroke-width="0.8"/><text x="120" y="172" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="end" dominant-baseline="central">扩散去噪</text><line x1="130" y1="172" x2="664" y2="172" stroke="#E5E3DA" stroke-width="0.8"/><text x="120" y="232" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="end" dominant-baseline="central">TTS 播放</text><line x1="130" y1="232" x2="664" y2="232" stroke="#E5E3DA" stroke-width="0.8"/><rect x="130" y="50" width="170" height="24" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="215" y="62" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">“明天北京天气怎么样？”</text><rect x="132" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="152" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="172" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="192" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="212" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="232" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="252" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="272" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="292" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="312" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text x="215" y="134" font-size="11" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">listen（每 80 ms 一个）</text><rect x="320" y="100" width="36" height="24" rx="4" fill="#534AB7" stroke="#534AB7" stroke-width="0.8"/><text x="338" y="112" font-size="11" fill="#FFFFFF" font-weight="500" text-anchor="middle" dominant-baseline="central">bos</text><rect x="362" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="382" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="402" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="422" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="442" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="462" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="482" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="502" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="522" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="542" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="562" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="582" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><rect x="602" y="104" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text x="492.0" y="134" font-size="11" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">speak（同时继续监听）</text><rect x="624" y="100" width="36" height="24" rx="4" fill="#534AB7" stroke="#534AB7" stroke-width="0.8"/><text x="642" y="112" font-size="11" fill="#FFFFFF" font-weight="500" text-anchor="middle" dominant-baseline="central">eos</text><line x1="338" y1="124" x2="380" y2="158" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/><rect x="360" y="160" width="80" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="400" y="172" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">≤K 轮</text><rect x="446" y="160" width="170" height="24" rx="4" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/><text x="531.0" y="172" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">继续去噪，收敛即停</text><line x1="440" y1="184" x2="440" y2="218" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/><text x="446" y="201" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">前 8 个 token 固定后</text><rect x="440" y="220" width="176" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="528.0" y="232" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">边念边接收后续 token</text><line x1="642" y1="124" x2="620" y2="218" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/><text x="638" y="160" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">截断</text><line x1="300" y1="266" x2="338" y2="266" stroke="#534AB7" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="294" y="266" font-size="11" fill="#534AB7" font-weight="400" text-anchor="end" dominant-baseline="central">① 话轮判断延迟</text><line x1="338" y1="286" x2="440" y2="286" stroke="#993C1D" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="448" y="286" font-size="11" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">② 触发后延迟（K=4 时 296 ms）</text><text x="340" y="316" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">用户听到第一声 ≈ ① + ②；论文的 K 扫描只测了 ②（示意，非比例尺）</text></svg>