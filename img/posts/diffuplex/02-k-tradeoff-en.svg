<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" width="680" height="334" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Latency vs quality as the prefix pass cap K varies</title><desc>Post-trigger latency and VoiceBench overall for K=2, 4, 6 and uncapped: 251 ms/80.5, 296 ms/82.3, 309 ms/82.6, 497 ms/84.0.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="334" rx="10" fill="#FFFFFF"/><text x="340" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Larger K: higher quality, later first audio</text><line x1="90" y1="250" x2="640" y2="250" stroke="#888780"/><line x1="90" y1="50" x2="90" y2="250" stroke="#888780"/><line x1="90" y1="250.0" x2="640" y2="250.0" stroke="#E5E3DA" stroke-width="0.6"/><text x="82" y="250.0" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">80</text><line x1="90" y1="161.11111111111111" x2="640" y2="161.11111111111111" stroke="#E5E3DA" stroke-width="0.6"/><text x="82" y="161.11111111111111" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">82</text><line x1="90" y1="72.22222222222223" x2="640" y2="72.22222222222223" stroke="#E5E3DA" stroke-width="0.6"/><text x="82" y="72.22222222222223" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">84</text><text x="90.0" y="266" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">200</text><text x="261.875" y="266" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">300</text><text x="433.75" y="266" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">400</text><text x="605.625" y="266" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">500</text><text x="365.0" y="288" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Post-trigger latency (ms)</text><text transform="rotate(-90 30 150)" x="30" y="150.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">VoiceBench overall</text><polyline points="177.65625,227.77777777777777 255.0,147.77777777777789 277.34375,134.44444444444468 600.46875,72.22222222222223" fill="none" stroke="#B4B2A9" stroke-width="1.2"/><circle cx="177.65625" cy="227.77777777777777" r="6" fill="#534AB7"/><text x="177.65625" y="209.77777777777777" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">K=2: 251 ms, 80.5</text><circle cx="255.0" cy="147.77777777777789" r="6" fill="#993C1D"/><text x="325.0" y="163.77777777777789" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">K=4: 296 ms, 82.3</text><circle cx="277.34375" cy="134.44444444444468" r="6" fill="#534AB7"/><text x="289.34375" y="116.44444444444468" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">K=6: 309 ms, 82.6</text><circle cx="600.46875" cy="72.22222222222223" r="6" fill="#534AB7"/><text x="600.46875" y="54.22222222222223" font-size="11" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">Uncapped: 497 ms, 84.0</text><text x="340" y="320" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">K = max passes before the prefix is frozen; data from the paper (RTX 6000; latency excludes AR decision time).</text></svg>