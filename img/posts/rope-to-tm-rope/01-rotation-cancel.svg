<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>RoPE 的旋转抵消</title><desc>两个单位圆。位置 (m=3, n=1) 与 (m=10, n=8) 的 q、k 旋转后绝对角度不同，但夹角都是 2 弧度，点积相同。</desc><defs><marker id="aq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="372" rx="10" fill="#FFFFFF"/><text x="170" y="28" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">例 1：m = 3，n = 1</text><circle cx="170" cy="190" r="100" fill="none" stroke="#B4B2A9" stroke-width="0.8"/><line x1="170" y1="190" x2="270" y2="190" stroke="#888780" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/><text x="220" y="202" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">原始 q = k</text><line x1="170" y1="190" x2="76.0" y2="176.6" stroke="#D85A30" stroke-width="2" stroke-linecap="round" marker-end="url(#aq)"/><line x1="170" y1="190" x2="221.3" y2="110.1" stroke="#1D9E75" stroke-width="2" stroke-linecap="round" marker-end="url(#ak)"/><path d="M190.5 158.0A38 38 0 0 0 132.4 184.6" fill="none" stroke="#BA7517" stroke-width="2"/><text x="144.2" y="133.6" font-size="13" fill="#854F0B" font-weight="500" text-anchor="middle" dominant-baseline="central">2 rad</text><text x="55.2" y="173.6" font-size="13" fill="#993C1D" font-weight="500" text-anchor="middle" dominant-baseline="central">q'</text><text x="232.7" y="92.4" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="middle" dominant-baseline="central">k'</text><text x="170" y="318" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">q 转 3 rad，k 转 1 rad</text><text x="170" y="337" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">q' 在 171.9°，k' 在 57.3°</text><text x="510" y="28" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">例 2：m = 10，n = 8</text><circle cx="510" cy="190" r="100" fill="none" stroke="#B4B2A9" stroke-width="0.8"/><line x1="510" y1="190" x2="610" y2="190" stroke="#888780" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/><text x="560" y="202" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">原始 q = k</text><line x1="510" y1="190" x2="430.3" y2="241.7" stroke="#D85A30" stroke-width="2" stroke-linecap="round" marker-end="url(#aq)"/><line x1="510" y1="190" x2="496.2" y2="96.0" stroke="#1D9E75" stroke-width="2" stroke-linecap="round" marker-end="url(#ak)"/><path d="M504.5 152.4A38 38 0 0 0 478.1 210.7" fill="none" stroke="#BA7517" stroke-width="2"/><text x="453.5" y="164.4" font-size="13" fill="#854F0B" font-weight="500" text-anchor="middle" dominant-baseline="central">2 rad</text><text x="412.7" y="253.1" font-size="13" fill="#993C1D" font-weight="500" text-anchor="middle" dominant-baseline="central">q'</text><text x="493.1" y="75.2" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="middle" dominant-baseline="central">k'</text><text x="510" y="318" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">q 转 10 rad，k 转 8 rad</text><text x="510" y="337" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">q' 在 213.0°，k' 在 98.4°</text><text x="340" y="358" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">绝对角度完全不同，夹角都是 (m − n)·θ = 2 rad，点积相同（图中 θ = 1 rad）</text></svg>
