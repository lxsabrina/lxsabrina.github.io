<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" width="680" height="312" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>音视频交错序列与各模态的位置 ID</title><desc>序列按 2 秒块排列，块内视频在前音频在后；文本、音频、视频 token 分别携带 (p,p,p)、(t,t,t)、(t,h,w)。</desc><defs></defs><rect x="0" y="0" width="680" height="312" rx="10" fill="#FFFFFF"/><text x="40" y="24" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">输入序列（从左到右）</text><rect x="40" y="42" width="135" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="107.5" y="58.5" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">视频块 1</text><text x="107.5" y="82.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">8 个 patch</text><text x="107.5" y="105.5" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">t ∈ {0, 25}</text><rect x="195" y="42" width="135" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="262.5" y="58.5" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">音频块 1</text><text x="262.5" y="82.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">50 个 token</text><text x="262.5" y="105.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">t = 0 … 49</text><rect x="350" y="42" width="135" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="417.5" y="58.5" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">视频块 2</text><text x="417.5" y="82.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">8 个 patch</text><text x="417.5" y="105.5" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">t ∈ {50, 75}</text><rect x="505" y="42" width="135" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="572.5" y="58.5" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">音频块 2</text><text x="572.5" y="82.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">50 个 token</text><text x="572.5" y="105.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">t = 50 … 99</text><path d="M40 132V140H330V132" fill="none" stroke="#73726C" stroke-width="1"/><text x="185" y="158" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">2 秒块 1</text><path d="M350 132V140H640V132" fill="none" stroke="#73726C" stroke-width="1"/><text x="495" y="158" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">2 秒块 2</text><text x="40" y="196" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">每个 token 携带的位置 ID (t, h, w)</text><rect x="40" y="212" width="180" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="130.0" y="227.6" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">文本 token</text><text x="130.0" y="250.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">(p, p, p)</text><text x="130.0" y="272.4" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">p = 序号</text><rect x="250" y="212" width="180" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="227.6" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">音频 token</text><text x="340.0" y="250.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">(t, t, t)</text><text x="340.0" y="272.4" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">t = 时间 ID</text><rect x="460" y="212" width="180" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="550.0" y="227.6" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">视频 patch</text><text x="550.0" y="250.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">(t, h, w)</text><text x="550.0" y="272.4" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">h、w = 行、列</text></svg>
