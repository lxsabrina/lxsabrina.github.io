<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" width="680" height="312" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Interleaved audio-video sequence and position IDs of each modality</title><desc>The sequence is laid out in 2-second blocks, with video before audio within a block; text, audio and video tokens carry (p,p,p), (t,t,t) and (t,h,w) respectively.</desc><defs></defs><rect x="0" y="0" width="680" height="312" rx="10" fill="#FFFFFF"/><text x="40" y="24" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Input sequence (left to right)</text><rect x="40" y="42" width="135" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="107.5" y="58.5" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Video block 1</text><text x="107.5" y="82.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">8 patches</text><text x="107.5" y="105.5" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">t ∈ {0, 25}</text><rect x="195" y="42" width="135" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="262.5" y="58.5" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Audio block 1</text><text x="262.5" y="82.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">50 tokens</text><text x="262.5" y="105.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">t = 0 … 49</text><rect x="350" y="42" width="135" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="417.5" y="58.5" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Video block 2</text><text x="417.5" y="82.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">8 patches</text><text x="417.5" y="105.5" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">t ∈ {50, 75}</text><rect x="505" y="42" width="135" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="572.5" y="58.5" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Audio block 2</text><text x="572.5" y="82.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">50 tokens</text><text x="572.5" y="105.5" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">t = 50 … 99</text><path d="M40 132V140H330V132" fill="none" stroke="#73726C" stroke-width="1"/><text x="185" y="158" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">2-second block 1</text><path d="M350 132V140H640V132" fill="none" stroke="#73726C" stroke-width="1"/><text x="495" y="158" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">2-second block 2</text><text x="40" y="196" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Position ID (t, h, w) carried by each token</text><rect x="40" y="212" width="180" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="130.0" y="227.6" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Text tokens</text><text x="130.0" y="250.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">(p, p, p)</text><text x="130.0" y="272.4" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">p = index</text><rect x="250" y="212" width="180" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="227.6" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Audio tokens</text><text x="340.0" y="250.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">(t, t, t)</text><text x="340.0" y="272.4" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">t = time ID</text><rect x="460" y="212" width="180" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="550.0" y="227.6" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Video patches</text><text x="550.0" y="250.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">(t, h, w)</text><text x="550.0" y="272.4" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">h, w = row, column</text></svg>
