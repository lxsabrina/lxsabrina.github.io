<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>Three ways to build the agent's context</title><desc>Three ways to build the agent's context</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="419" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="30" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Three ways to build the agent's context</text>
<rect x="122.0" y="48" width="148" height="34" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="196.0" y="69.5" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Full injection</text>
<rect x="284.0" y="48" width="148" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="358.0" y="69.5" font-size="13" fill="#534AB7" text-anchor="middle" font-weight="bold">Retrieval-based</text>
<rect x="446.0" y="48" width="148" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="520.0" y="69.5" font-size="13" fill="#0F6E56" text-anchor="middle" font-weight="bold">Rule matching</text>
<text x="14" y="132" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">Who decides</text>
<rect x="122.0" y="94" width="148" height="68" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="196.0" y="131.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Nobody: model sees all</text>
<rect x="284.0" y="94" width="148" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="358.0" y="116.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Retriever + re-ranker</text>
<text x="358.0" y="131.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">+ budget; model</text>
<text x="358.0" y="146.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">self-check</text>
<rect x="446.0" y="94" width="148" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="520.0" y="116.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Rule conditions +</text>
<text x="520.0" y="131.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">tiers; relations set</text>
<text x="520.0" y="146.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">priority</text>
<text x="14" y="210" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">Cost per step</text>
<rect x="122.0" y="172" width="148" height="68" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="196.0" y="209.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Highest static tokens</text>
<rect x="284.0" y="172" width="148" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="358.0" y="194.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Retrieval + small</text>
<text x="358.0" y="209.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">prompt; extra call on</text>
<text x="358.0" y="224.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">fallback</text>
<rect x="446.0" y="172" width="148" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="520.0" y="194.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Model called only for</text>
<text x="520.0" y="209.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">rules needing a</text>
<text x="520.0" y="224.8" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">verdict</text>
<text x="14" y="288" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">Typical failure</text>
<rect x="122.0" y="250" width="148" height="68" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="196.0" y="280.4" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Attention dilution,</text>
<text x="196.0" y="295.4" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">wrong tool, cost</text>
<rect x="284.0" y="250" width="148" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="358.0" y="272.9" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Misses (needed item</text>
<text x="358.0" y="287.9" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">hidden), drift,</text>
<text x="358.0" y="302.9" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">related rules split</text>
<rect x="446.0" y="250" width="148" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="520.0" y="280.4" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Mis-judged condition;</text>
<text x="520.0" y="295.4" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">complexity</text>
<text x="14" y="366" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">Fits when</text>
<rect x="122.0" y="328" width="148" height="68" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="196.0" y="350.9" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Few</text>
<text x="196.0" y="365.9" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">instructions/tools,</text>
<text x="196.0" y="380.9" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">short loops</text>
<rect x="284.0" y="328" width="148" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="358.0" y="350.9" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Modular instructions,</text>
<text x="358.0" y="365.9" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">big catalog, long</text>
<text x="358.0" y="380.9" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">loops</text>
<rect x="446.0" y="328" width="148" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="520.0" y="358.4" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">Compliance rules with</text>
<text x="520.0" y="373.4" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal">priority/dependency</text>
</svg>