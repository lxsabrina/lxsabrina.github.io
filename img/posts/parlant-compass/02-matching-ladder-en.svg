<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Rule filtering: three-tier routing and relation resolution</title><desc>Each rule gets a starting tier from effort, weight and attachments; NONE is admitted straight into the discovered set, RECALL uses only embedding and logistic regression to decide admission, and only RANK gets this turn's match from Jev or a small model; results then go through relation resolution into the state.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="560" rx="10" fill="#FFFFFF"/><rect x="190" y="16" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="340" y="36" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">One Rule (policy or observation)</text><rect x="70" y="76" width="540" height="58" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340" y="97" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Starting tier from effort × weight; NONE directly when there are ≤ 5 rules</text><text x="340" y="118" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Rules with labels, dependencies, priority, tools, review or on_matched are forced up to RANK</text><rect x="22" y="166" width="196" height="76" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="120" y="188" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">NONE</text><text x="120" y="210" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Straight into discovered set</text><text x="120" y="228" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">No judging</text><rect x="242" y="166" width="196" height="76" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="340" y="188" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">RECALL</text><text x="340" y="210" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">embedding + logistic regression</text><text x="340" y="228" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Decides discovery only</text><rect x="462" y="166" width="196" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="560" y="188" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">RANK</text><text x="560" y="210" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Also enters discovered set</text><text x="560" y="228" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Jev / small model decides</text><rect x="40" y="276" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="180" y="297" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Discovered set (sticky)</text><text x="180" y="317" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Stays until pruned</text><rect x="360" y="276" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="500" y="297" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Matched this turn (temporary)</text><text x="500" y="317" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Valid for this turn only</text><rect x="70" y="366" width="540" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340" y="387" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Relation resolution (pure code, no model call)</text><text x="340" y="407" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Expand entailment → filter unmet dependencies → drop losers by priority</text><rect x="70" y="452" width="540" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="340" y="473" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Written into this turn's state</text><text x="340" y="493" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Matched this turn · discovered set · withdrawn this turn (rules overridden by priority)</text><path d="M340 56V76" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M120 134V166" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M340 134V166" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M560 134V166" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M120 242V276" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M340 242V262H260V276" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M560 242V276" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M180 332V366" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M500 332V366" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M340 422V452" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="550" y="259" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">Only RANK gives a verdict this turn</text></svg>
