<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>概念对照：3.3.2 与 compass-wip</title><desc>3.3.2 的 create_guideline 与 create_observation 对应 compass-wip 里统一的 Rule（create_policy 与 create_observation）；create_journey 在该分支里标为范围之外；另外新增 Effort、Weight、关系等能力。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="440" rx="10" fill="#FFFFFF"/><text x="24" y="28" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">3.3.2（已发布）</text><text x="250" y="28" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">compass-wip（未发布）</text><rect x="24" y="60" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="119" y="84" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">create_guideline</text><rect x="24" y="120" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="119" y="144" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">create_observation</text><rect x="24" y="200" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="119" y="224" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">create_journey</text><rect x="250" y="44" width="406" height="150" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="266" y="64" font-size="13" font-weight="500" fill="#3C3489" text-anchor="start" dominant-baseline="central">统一的 Rule（core/rules.py:65）</text><rect x="266" y="78" width="374" height="48" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="278" y="96" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">create_policy</text><text x="278" y="113" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">只有 content，没有 condition</text><rect x="266" y="134" width="374" height="48" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="278" y="152" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">create_observation</text><text x="278" y="169" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">带 condition，和 policy 是同一个 dataclass</text><rect x="250" y="200" width="406" height="48" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/><text x="266" y="217" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">journey</text><text x="266" y="235" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">在 relational_resolver.py 的文档字符串里标为范围之外</text><rect x="250" y="264" width="406" height="140" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="266" y="284" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">新增能力（3.3.2 的 sdk.py 里没找到对应项）</text><text x="266" y="312" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Effort 五档 · Weight 三档 · trigger_effort</text><text x="266" y="334" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">signals / anti_signals · evaluation_func</text><text x="266" y="356" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">关系：prioritize_over · depend_on · entail · reevaluate_after</text><text x="266" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">labels · 复核开关 · on_matched / on_discovered</text><path d="M214 84H266" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M214 144H266" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M214 224H250" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arr)"/></svg>
