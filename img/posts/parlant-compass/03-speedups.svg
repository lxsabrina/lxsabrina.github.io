<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 330" width="704" height="330" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>加速手段分布在三个时间点</title><desc>会话开始时预热缓存；一轮之内用并发、批量、跳过判断与 hedging；回复发出后压缩、修剪并为下一轮预热。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="704" height="330" rx="10" fill="#FFFFFF"/><rect x="24" y="20" width="208" height="252" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="40" y="44" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">会话开始</text><text x="40" y="72" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 会话一创建就预热</text><text x="54" y="92" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">稳定的系统提示前缀</text><text x="40" y="122" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 工具描述的 embedding</text><text x="54" y="142" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">走磁盘缓存，重启不重算</text><text x="40" y="172" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 预热只在扇出 ≥ 5 时</text><text x="54" y="192" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">才划算</text><rect x="248" y="20" width="208" height="252" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="264" y="44" font-size="13" font-weight="500" fill="#3C3489" text-anchor="start" dominant-baseline="central">一轮之内</text><text x="264" y="72" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 连发消息：第 2 条等 1 秒，</text><text x="278" y="92" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">第 3 条起等 3 秒</text><text x="264" y="112" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· match_early 先跑确定性判断</text><text x="264" y="132" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· NONE 档不判断，</text><text x="278" y="152" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">RECALL 档不调 LLM</text><text x="264" y="172" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 匹配、工具打分、术语召回并行</text><text x="264" y="192" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Jev 一次请求判断多条规则</text><text x="264" y="212" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 请求超时未返回就再发一个，</text><text x="278" y="232" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">排序 5 秒、回复 10 秒</text><rect x="472" y="20" width="208" height="252" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="488" y="44" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">回复发出后</text><text x="488" y="72" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 压缩历史、修剪已发现集</text><text x="502" y="92" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">（超 30 条清到 20 条）</text><text x="488" y="122" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 为下一轮预热排序与</text><text x="502" y="142" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">响应循环的稳定前缀</text><text x="488" y="172" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 清理引起的缓存失效</text><text x="502" y="192" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">安排在两轮之间</text><path d="M234 146H246" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M458 146H470" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="24" y="304" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">来源：engine.py、optimization_policy.py、base_loop.py（compass-wip）</text></svg>
