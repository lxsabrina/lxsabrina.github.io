<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 330" width="704" height="330" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Speed-ups by three points in time</title><desc>Warm the cache at session start; within a turn use concurrency, batching, skipped judging and hedging; after the reply, compact, prune and warm up for the next turn.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="704" height="330" rx="10" fill="#FFFFFF"/><rect x="24" y="20" width="208" height="252" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="40" y="44" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Session start</text><text x="40" y="72" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Warm up at session start:</text><text x="54" y="92" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">stable system-prompt prefix</text><text x="40" y="122" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Tool-description embeddings</text><text x="54" y="142" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">disk-cached across restarts</text><text x="40" y="172" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Warm up only at fan-out ≥ 5</text><text x="54" y="192" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">to be worth it</text><rect x="248" y="20" width="208" height="252" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="264" y="44" font-size="13" font-weight="500" fill="#3C3489" text-anchor="start" dominant-baseline="central">Within one turn</text><text x="264" y="72" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Bursts: 2nd message waits 1 s,</text><text x="278" y="92" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">3rd onward wait 3 s</text><text x="264" y="112" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· match_early: deterministic first</text><text x="264" y="132" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· NONE: no judging;</text><text x="278" y="152" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">RECALL: no LLM call</text><text x="264" y="172" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Parallel: match, tools, terms</text><text x="264" y="192" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Jev: many rules per request</text><text x="264" y="212" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Hedging: resend on timeout,</text><text x="278" y="232" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">ranking 5 s, reply 10 s</text><rect x="472" y="20" width="208" height="252" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="488" y="44" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">After the reply is sent</text><text x="488" y="72" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Compact, prune discovered set</text><text x="502" y="92" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">(over 30 → cut to 20)</text><text x="488" y="122" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Warm up next turn:</text><text x="502" y="142" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">ranker + response-loop prefix</text><text x="488" y="172" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· Prune-induced cache misses</text><text x="502" y="192" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">scheduled between turns</text><path d="M234 146H246" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M458 146H470" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="24" y="304" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Source: engine.py, optimization_policy.py, base_loop.py (compass-wip)</text></svg>
