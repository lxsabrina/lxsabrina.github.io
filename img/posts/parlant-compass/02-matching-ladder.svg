<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>规则筛选：三档分流与关系解析</title><desc>每条规则按 effort、weight 与附件选起始档位；NONE 直接准入已发现集，RECALL 只用 embedding 与逻辑回归决定是否准入，RANK 才由 Jev 或小模型给出本轮匹配；结果再经关系解析写入状态。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="560" rx="10" fill="#FFFFFF"/><rect x="190" y="16" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="340" y="36" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">一条 Rule（policy 或 observation）</text><rect x="70" y="76" width="540" height="58" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340" y="97" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">按 effort × weight 选起始档位；规则 ≤ 5 条时直接 NONE</text><text x="340" y="118" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">带 labels、依赖、priority、工具、复核、on_matched 的规则强制升到 RANK</text><rect x="22" y="166" width="196" height="76" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="120" y="188" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">NONE</text><text x="120" y="210" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">直接准入已发现集</text><text x="120" y="228" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">不做任何判断</text><rect x="242" y="166" width="196" height="76" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="340" y="188" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">RECALL</text><text x="340" y="210" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">embedding + 逻辑回归</text><text x="340" y="228" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">只决定是否进发现集</text><rect x="462" y="166" width="196" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="560" y="188" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">RANK</text><text x="560" y="210" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">新规则也进发现集，再判</text><text x="560" y="228" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Jev 或小模型，命中即本轮匹配</text><rect x="40" y="276" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="180" y="297" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">已发现集（粘性）</text><text x="180" y="317" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">留到被修剪为止</text><rect x="360" y="276" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="500" y="297" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">本轮匹配（临时）</text><text x="500" y="317" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">只对这一轮有效</text><rect x="70" y="366" width="540" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340" y="387" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">关系解析（纯代码，不调模型）</text><text x="340" y="407" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">展开蕴含 → 过滤未满足的依赖 → 按 priority 淘汰输家</text><rect x="70" y="452" width="540" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="340" y="473" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">写入本轮状态</text><text x="340" y="493" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">本轮匹配 · 已发现集 · 本轮撤销（被 priority 压下的规则）</text><path d="M340 56V76" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M120 134V166" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M340 134V166" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M560 134V166" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M120 242V276" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M340 242V262H260V276" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M560 242V276" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M180 332V366" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M500 332V366" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M340 422V452" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="550" y="259" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">仅 RANK 有本轮判决</text></svg>
