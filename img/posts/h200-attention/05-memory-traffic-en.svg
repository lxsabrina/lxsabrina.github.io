<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Memory reads and writes of ordinary attention versus FlashAttention</title><desc>The ordinary way writes the N×N score matrix back to memory and reads it again; FlashAttention keeps the whole computation in on-chip cache, reading only inputs and writing only outputs.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="250" rx="10" fill="#FFFFFF"/><text x="40" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Ordinary way: every operator's intermediate result goes through memory</text><rect x="40" y="38" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="92.0" y="53.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Memory</text><text x="92.0" y="73.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Q, K, V</text><line x1="144" y1="62" x2="162" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="164" y="38" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="216.0" y="53.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Q×K</text><text x="216.0" y="73.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Get S</text><line x1="268" y1="62" x2="286" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="288" y="38" width="104" height="48" rx="8" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="340.0" y="53.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">Write out</text><text x="340.0" y="73.0" font-size="12" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">S, P: N×N each</text><line x1="392" y1="62" x2="410" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="412" y="38" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="464.0" y="53.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Read back</text><text x="464.0" y="73.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">softmax, ×V</text><line x1="516" y1="62" x2="534" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="536" y="38" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="588.0" y="53.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Output</text><text x="588.0" y="73.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Write out</text><text x="40" y="128" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">FlashAttention: intermediates stay on chip</text><rect x="40" y="144" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="92.0" y="159.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Memory</text><text x="92.0" y="179.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Q, K, V tiles</text><line x1="144" y1="168" x2="162" y2="168" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="164" y="144" width="348" height="48" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="338.0" y="159.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">On-chip cache (SRAM)</text><text x="338.0" y="179.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">Q×K → online softmax → ×V, in one pass</text><line x1="512" y1="168" x2="534" y2="168" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="536" y="144" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="588.0" y="159.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Output</text><text x="588.0" y="179.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Write out</text><text x="338" y="222" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Loop over K and V tile by tile; scores and weights are discarded once used and never reach memory</text></svg>
