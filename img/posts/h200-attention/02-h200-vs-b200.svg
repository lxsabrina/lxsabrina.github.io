<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>H200 与 B200 从软件到硬件的对比</title><desc>DeepInfer 的算子层落到两种 GPU 上：编译目标、张量核心指令、低精度格式决定能否编译；封装、显存、互联决定性能上限；最后一行是 DeepInfer 的支持状态。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="620" rx="10" fill="#FFFFFF"/><rect x="40" y="20" width="600" height="56" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="39.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">DeepInfer 算子层</text><text x="340.0" y="59.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">FlashMLA · DeepGEMM · DeepEP · DeepSelect</text><line x1="255" y1="78" x2="255" y2="102" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="520" y1="78" x2="520" y2="102" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="130" y="104" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="124.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">H200（Hopper，SM90）</text><rect x="400" y="104" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="124.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">B200（Blackwell，SM100）</text><text x="40" y="172" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">指令与精度：决定 kernel 能不能编译</text><text x="40" y="206" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">编译目标</text><rect x="130" y="186" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="206.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">sm_90a</text><rect x="400" y="186" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="206.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">sm_100a</text><text x="40" y="256" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">张量核心指令</text><rect x="130" y="236" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="256.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">wgmma + TMA</text><rect x="400" y="236" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="256.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">tcgen05 + TMEM</text><text x="40" y="306" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">低精度格式</text><rect x="130" y="286" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="306.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">FP8，没有 FP4</text><rect x="400" y="286" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="306.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">FP8 + FP4</text><text x="40" y="350" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">容量与带宽：决定编译通过后能跑多快</text><text x="40" y="384" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">芯片封装</text><rect x="130" y="364" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="384.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">单 die</text><rect x="400" y="364" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="384.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">双 die 合封</text><text x="40" y="434" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">显存</text><rect x="130" y="414" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="434.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">141GB HBM3e · 4.8TB/s</text><rect x="400" y="414" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="434.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">约 180GB · 约 8TB/s</text><text x="40" y="484" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">多卡互联</text><rect x="130" y="464" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="484.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">NVLink 4 · 900GB/s</text><rect x="400" y="464" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="484.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">NVLink 5 · 1.8TB/s</text><text x="40" y="528" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">DeepInfer 现状（2026 年 10 月）</text><text x="40" y="562" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">支持状态</text><rect x="130" y="542" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="562.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">社区移植，实验性</text><rect x="400" y="542" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="562.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">官方支持，CUDA 13</text><text x="340" y="602" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">B200 的容量与带宽因机型而异，图中为约数</text></svg>
