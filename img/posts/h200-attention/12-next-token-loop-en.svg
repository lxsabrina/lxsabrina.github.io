<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>From the last token's vector to the next-token generation loop</title><desc>The last token's vector at layer 40 is multiplied by the output matrix to give 129K scores, then softmax and sampling; the new token looks up its embedding and passes through 40 layers computing only this one position, reusing the KV cache.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="240" rx="10" fill="#FFFFFF"/><rect x="50" y="40" width="130" height="56" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="115.0" y="59.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Last token</text><text x="115.0" y="79.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">x at layer 40</text><line x1="180" y1="68" x2="198" y2="68" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="200" y="40" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="265.0" y="59.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">× output matrix</text><text x="265.0" y="79.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">5120 → 129K</text><line x1="330" y1="68" x2="348" y2="68" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="350" y="40" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="415.0" y="59.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">softmax</text><text x="415.0" y="79.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">Scores to probabilities</text><line x1="480" y1="68" x2="498" y2="68" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="500" y="40" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="565.0" y="59.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Sampling</text><text x="565.0" y="79.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">Pick one token</text><line x1="565" y1="98" x2="565" y2="148" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="440" y="150" width="190" height="56" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="535.0" y="169.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">New token → embedding</text><text x="535.0" y="189.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">Becomes x of layer 1</text><line x1="440" y1="178" x2="392" y2="178" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="150" y="150" width="240" height="56" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="270.0" y="169.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">40 layers, one position</text><text x="270.0" y="189.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">Attention reads the KV cache</text><path d="M150 178 L115 178 L115 100" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/></svg>
