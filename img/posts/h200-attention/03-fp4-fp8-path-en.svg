<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Three data paths for FP4 weights on B200 and H200</title><desc>B200 sends FP4 straight into the tensor core; H200 option 1 stores FP4 and converts to FP8 on chip before computing; option 2 stores FP8 directly, doubling memory use.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="360" rx="10" fill="#FFFFFF"/><text x="40" y="24" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">B200 (Blackwell): compute FP4 directly</text><rect x="40" y="40" width="100" height="44" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="90.0" y="53.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">FP4 weights</text><text x="90.0" y="73.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">Memory use 1×</text><line x1="140" y1="62" x2="428" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="284.0" y="48" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">No conversion</text><rect x="430" y="40" width="140" height="44" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="500.0" y="53.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Tensor core</text><text x="500.0" y="73.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">FP4 math</text><line x1="570" y1="62" x2="594" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="596" y="40" width="44" height="44" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="618.0" y="62.0" font-size="13" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Out</text><text x="40" y="130" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">H200 option 1: store FP4, convert to FP8 on chip, then compute</text><rect x="40" y="146" width="100" height="44" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="90.0" y="159.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">FP4 weights</text><text x="90.0" y="179.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">Memory use 1×</text><line x1="140" y1="168" x2="268" y2="168" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="270" y="146" width="130" height="44" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="335.0" y="159.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Convert</text><text x="335.0" y="179.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">FP4→FP8 + scale</text><line x1="400" y1="168" x2="428" y2="168" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="430" y="146" width="140" height="44" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="500.0" y="159.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Tensor core</text><text x="500.0" y="179.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">FP8 math</text><line x1="570" y1="168" x2="594" y2="168" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="596" y="146" width="44" height="44" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="618.0" y="168.0" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Out</text><text x="40" y="236" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">H200 option 2: store FP8 directly</text><rect x="40" y="252" width="200" height="44" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="140.0" y="265.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">FP8 weights</text><text x="140.0" y="285.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">Memory use 2×</text><line x1="240" y1="274" x2="428" y2="274" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="334.0" y="260" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">No conversion</text><rect x="430" y="252" width="140" height="44" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="500.0" y="265.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Tensor core</text><text x="500.0" y="285.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">FP8 math</text><line x1="570" y1="274" x2="594" y2="274" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="596" y="252" width="44" height="44" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="618.0" y="274.0" font-size="13" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Out</text><text x="340" y="332" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Width of the left boxes shows the weights' memory size: FP8 is twice FP4</text></svg>
