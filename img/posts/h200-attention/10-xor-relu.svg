<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>线性分不开“不好/不坏”，ReLU 的两个开关可以</title><desc>四个词组放在 p、n 平面的四角，正面的“好”和“不坏”在对角，任何直线都分不开；h1、h2 两个 ReLU 开关分别在右下角和左上角亮起。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="380" rx="10" fill="#FFFFFF"/><text x="170" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">线性：一条直线分不开</text><text x="510" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">ReLU：两个开关</text><text x="60" y="40" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">↑ 否定 n</text><rect x="60" y="50" width="220" height="220" rx="4" fill="none" fill-opacity="1" stroke="#B4B2A9" stroke-width="0.8"/><circle cx="90" cy="240" r="8" fill="#D85A30"/><text x="90" y="258" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">坏</text><circle cx="250" cy="240" r="8" fill="#1D9E75"/><text x="250" y="258" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">好</text><circle cx="90" cy="80" r="8" fill="#1D9E75"/><text x="90" y="62" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">不坏</text><circle cx="250" cy="80" r="8" fill="#D85A30"/><text x="250" y="62" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">不好</text><text x="170" y="288" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">正面词 p →</text><text x="400" y="40" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">↑ 否定 n</text><polygon points="510,270 620,270 620,160" fill="#1D9E75" fill-opacity="0.15"/><polygon points="400,50 510,50 400,160" fill="#1D9E75" fill-opacity="0.15"/><rect x="400" y="50" width="220" height="220" rx="4" fill="none" fill-opacity="1" stroke="#B4B2A9" stroke-width="0.8"/><circle cx="430" cy="240" r="8" fill="#D85A30"/><text x="430" y="258" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">坏</text><circle cx="590" cy="240" r="8" fill="#1D9E75"/><text x="590" y="258" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">好</text><circle cx="430" cy="80" r="8" fill="#1D9E75"/><text x="430" y="62" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">不坏</text><circle cx="590" cy="80" r="8" fill="#D85A30"/><text x="590" y="62" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">不好</text><text x="510" y="288" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">正面词 p →</text><line x1="170" y1="50" x2="170" y2="270" stroke="#888780" stroke-width="1" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="5 4"/><text x="170" y="310" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">直线怎么画，同色的点都会被分到两边</text><text x="510" y="310" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">右下亮区：h1 = ReLU(p − n) &gt; 0</text><text x="510" y="330" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">左上亮区：h2 = ReLU(n − p) &gt; 0</text><circle cx="250" cy="360" r="6" fill="#1D9E75"/><text x="262" y="360" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">最终正面</text><circle cx="360" cy="360" r="6" fill="#D85A30"/><text x="372" y="360" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">最终负面</text></svg>
