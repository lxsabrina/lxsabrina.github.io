<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Linear cannot separate "not good / not bad"; two ReLU switches can</title><desc>The four phrases sit at the corners of the p–n plane; the positive "good" and "not bad" are on a diagonal, and no straight line separates them. The two ReLU switches h1 and h2 light up in the lower-right and upper-left corners.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="380" rx="10" fill="#FFFFFF"/><text x="170" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Linear: one line cannot separate them</text><text x="510" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">ReLU: two switches</text><text x="60" y="40" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">↑ negation n</text><rect x="60" y="50" width="220" height="220" rx="4" fill="none" fill-opacity="1" stroke="#B4B2A9" stroke-width="0.8"/><circle cx="90" cy="240" r="8" fill="#D85A30"/><text x="90" y="258" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">bad</text><circle cx="250" cy="240" r="8" fill="#1D9E75"/><text x="250" y="258" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">good</text><circle cx="90" cy="80" r="8" fill="#1D9E75"/><text x="90" y="62" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">not bad</text><circle cx="250" cy="80" r="8" fill="#D85A30"/><text x="250" y="62" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">not good</text><text x="170" y="288" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">positive word p →</text><text x="400" y="40" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">↑ negation n</text><polygon points="510,270 620,270 620,160" fill="#1D9E75" fill-opacity="0.15"/><polygon points="400,50 510,50 400,160" fill="#1D9E75" fill-opacity="0.15"/><rect x="400" y="50" width="220" height="220" rx="4" fill="none" fill-opacity="1" stroke="#B4B2A9" stroke-width="0.8"/><circle cx="430" cy="240" r="8" fill="#D85A30"/><text x="430" y="258" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">bad</text><circle cx="590" cy="240" r="8" fill="#1D9E75"/><text x="590" y="258" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">good</text><circle cx="430" cy="80" r="8" fill="#1D9E75"/><text x="430" y="62" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">not bad</text><circle cx="590" cy="80" r="8" fill="#D85A30"/><text x="590" y="62" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="middle" dominant-baseline="central">not good</text><text x="510" y="288" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">positive word p →</text><line x1="170" y1="50" x2="170" y2="270" stroke="#888780" stroke-width="1" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="5 4"/><text x="170" y="310" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Any line puts same-colored points on both sides</text><text x="510" y="310" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Lower-right lit area: h1 = ReLU(p − n) &gt; 0</text><text x="510" y="330" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Upper-left lit area: h2 = ReLU(n − p) &gt; 0</text><circle cx="250" cy="360" r="6" fill="#1D9E75"/><text x="262" y="360" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Final: positive</text><circle cx="360" cy="360" r="6" fill="#D85A30"/><text x="372" y="360" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Final: negative</text></svg>
