<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>H200 versus B200 from software to hardware</title><desc>DeepInfer's operator layer lands on two kinds of GPU: compile target, tensor-core instructions and low-precision formats decide whether it compiles; packaging, memory and interconnect set the performance ceiling; the last row is DeepInfer's support status.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="620" rx="10" fill="#FFFFFF"/><rect x="40" y="20" width="600" height="56" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="39.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">DeepInfer operator layer</text><text x="340.0" y="59.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">FlashMLA · DeepGEMM · DeepEP · DeepSelect</text><line x1="255" y1="78" x2="255" y2="102" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="520" y1="78" x2="520" y2="102" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="130" y="104" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="124.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">H200 (Hopper, SM90)</text><rect x="400" y="104" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="124.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">B200 (Blackwell, SM100)</text><text x="40" y="172" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Instructions and precision: whether a kernel can compile</text><text x="40" y="206" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Compile target</text><rect x="130" y="186" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="206.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">sm_90a</text><rect x="400" y="186" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="206.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">sm_100a</text><text x="40" y="256" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Instructions</text><rect x="130" y="236" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="256.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">wgmma + TMA</text><rect x="400" y="236" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="256.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">tcgen05 + TMEM</text><text x="40" y="306" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Precision</text><rect x="130" y="286" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="306.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">FP8, no FP4</text><rect x="400" y="286" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="306.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">FP8 + FP4</text><text x="40" y="350" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Capacity and bandwidth: how fast it runs once it compiles</text><text x="40" y="384" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Chip packaging</text><rect x="130" y="364" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="384.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Single die</text><rect x="400" y="364" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="384.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Dual-die package</text><text x="40" y="434" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Memory</text><rect x="130" y="414" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="434.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">141GB HBM3e · 4.8TB/s</text><rect x="400" y="414" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="434.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">About 180 GB · about 8 TB/s</text><text x="40" y="484" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Interconnect</text><rect x="130" y="464" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="484.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">NVLink 4 · 900GB/s</text><rect x="400" y="464" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="484.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">NVLink 5 · 1.8TB/s</text><text x="40" y="528" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">DeepInfer status (October 2026)</text><text x="40" y="562" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Support status</text><rect x="130" y="542" width="250" height="40" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="255.0" y="562.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Community port, experimental</text><rect x="400" y="542" width="240" height="40" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="520.0" y="562.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Officially supported, CUDA 13</text><text x="340" y="602" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">B200 capacity and bandwidth vary by model; figures are approximate</text></svg>
