<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Matrix shapes in attention</title><desc>Q times K transposed gives the N×N score matrix S; a row-wise softmax gives the weights P; P times V gives the output O. Orange marks row i and column j.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="400" rx="10" fill="#FFFFFF"/><rect x="60" y="50" width="40" height="120" rx="4" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="80.0" y="78" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">Q</text><rect x="60" y="98" width="40" height="10" rx="1" fill="none" fill-opacity="1" stroke="#EF9F27" stroke-width="1.6"/><text x="80" y="186" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">N×d</text><text x="125" y="110" font-size="16" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">×</text><rect x="150" y="90" width="120" height="40" rx="4" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="185" y="110.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">K^T</text><rect x="226" y="90" width="10" height="40" rx="1" fill="none" fill-opacity="1" stroke="#EF9F27" stroke-width="1.6"/><text x="210" y="146" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">d×N</text><text x="295" y="110" font-size="16" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">=</text><rect x="320" y="50" width="120" height="120" rx="4" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="356" y="130" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">S scores</text><text x="356" y="150" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">N×N</text><rect x="396" y="98" width="10" height="10" rx="1" fill="#EF9F27" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="458" y="88" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Orange cell = q_i · k_j ÷ √d</text><text x="458" y="110" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Relevance of token i to j</text><text x="458" y="132" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">N×N, grows with context</text><path d="M380 172 L380 200 L120 200 L120 236" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/><text x="140" y="188" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">softmax (normalize each row)</text><rect x="60" y="240" width="120" height="120" rx="4" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="120.0" y="275" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">P weights</text><text x="120.0" y="295" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">N×N</text><rect x="60" y="318" width="120" height="10" rx="1" fill="none" fill-opacity="1" stroke="#EF9F27" stroke-width="1.6"/><text x="195" y="300" font-size="16" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">×</text><rect x="210" y="240" width="40" height="120" rx="4" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="230.0" y="290" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">V</text><text x="230" y="376" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">N×d</text><text x="270" y="300" font-size="16" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">=</text><rect x="290" y="240" width="40" height="120" rx="4" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="310.0" y="290" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">O</text><rect x="290" y="318" width="40" height="10" rx="1" fill="none" fill-opacity="1" stroke="#EF9F27" stroke-width="1.6"/><text x="310" y="376" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">N×d</text><text x="360" y="268" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Each row of weights sums to 1</text><text x="360" y="290" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Row i of O = Σ_j p_ij · v_j</text><text x="360" y="312" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">A weighted average of the rows of V</text><text x="360" y="334" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Causal model: weights with j &gt; i are 0</text></svg>
