<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>FlashMLA 的 split-KV 与合并</title><desc>一个请求的 KV cache 被切成 4 段交给 4 个 SM，各自算出局部的 m、l、O；合并 kernel 按全局最大值换单位后相加。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="380" rx="10" fill="#FFFFFF"/><text x="40" y="22" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">一个请求的 KV cache（压缩向量 c，分页存放在显存）</text><rect x="40" y="36" width="600" height="44" rx="6" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><line x1="190" y1="36" x2="190" y2="80" stroke="#0F6E56" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="340" y1="36" x2="340" y2="80" stroke="#0F6E56" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="490" y1="36" x2="490" y2="80" stroke="#0F6E56" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="115" y="58" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">token 0–255</text><line x1="115" y1="82" x2="115" y2="116" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="265" y="58" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">256–511</text><line x1="265" y1="82" x2="265" y2="116" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="415" y="58" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">512–767</text><line x1="415" y1="82" x2="415" y2="116" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="565" y="58" font-size="12" fill="#085041" font-weight="400" text-anchor="middle" dominant-baseline="central">768–1023</text><line x1="565" y1="82" x2="565" y2="116" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="50" y="118" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="115.0" y="137.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">SM 0</text><text x="115.0" y="157.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">局部 m、l、O</text><rect x="200" y="118" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="265.0" y="137.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">SM 1</text><text x="265.0" y="157.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">局部 m、l、O</text><rect x="350" y="118" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="415.0" y="137.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">SM 2</text><text x="415.0" y="157.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">局部 m、l、O</text><rect x="500" y="118" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="565.0" y="137.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">SM 3</text><text x="565.0" y="157.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">局部 m、l、O</text><line x1="115" y1="176" x2="262" y2="226" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="265" y1="176" x2="312" y2="226" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="415" y1="176" x2="368" y2="226" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="565" y1="176" x2="418" y2="226" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="190" y="228" width="300" height="56" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="247.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">合并 kernel</text><text x="340.0" y="267.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">按全局 m 换单位后相加</text><line x1="340" y1="286" x2="340" y2="312" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="220" y="314" width="240" height="44" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="336.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">64 个头的输出 O ÷ l</text></svg>
