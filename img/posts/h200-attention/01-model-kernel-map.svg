<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>DeepSeek-V4.1 一次前向与底层算子的对应关系</title><desc>左列是模型结构：embedding、40 层注意力加 MoE、LM head；右列是每一步依赖的算子库：FlashMLA、DeepSelect、DeepEP、DeepGEMM 以及 DSpark 草稿头。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="600" rx="10" fill="#FFFFFF"/><text x="190" y="16" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">模型结构（写在推理引擎的代码里）</text><text x="500" y="16" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">依赖的算子（GPU kernel）</text><rect x="60" y="30" width="260" height="44" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="190.0" y="52.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">输入 token ids</text><line x1="190" y1="74" x2="190" y2="96" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="60" y="98" width="260" height="56" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="190.0" y="117.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Embedding 查表</text><text x="190.0" y="137.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">129,280 × 5120 的表</text><line x1="190" y1="154" x2="190" y2="186" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="40" y="180" width="600" height="270" rx="14" fill="none" fill-opacity="1" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/><text x="56" y="198" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">× 40 层（DecoderLayer）</text><rect x="60" y="214" width="260" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="190.0" y="233.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">注意力</text><text x="190.0" y="253.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">压缩稀疏注意力 + indexer</text><line x1="190" y1="270" x2="190" y2="300" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="60" y="302" width="260" height="56" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="190.0" y="321.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">MoE</text><text x="190.0" y="341.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">384 个专家选 6 个 + 共享专家</text><text x="190" y="392" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">每个子层的输出都加回残差流</text><text x="190" y="414" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">x ← x + attn(x)；x ← x + moe(x)</text><rect x="380" y="214" width="240" height="56" rx="8" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="500.0" y="233.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">FlashMLA 等注意力 kernel</text><text x="500.0" y="253.0" font-size="12" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">读压缩后的 KV cache</text><rect x="380" y="290" width="240" height="40" rx="8" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="500.0" y="310.0" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">DeepSelect：路由 top-k</text><rect x="380" y="338" width="240" height="40" rx="8" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="500.0" y="358.0" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">DeepEP：跨卡分发 / 汇总</text><rect x="380" y="386" width="240" height="40" rx="8" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="500.0" y="406.0" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">DeepGEMM：专家矩阵乘</text><line x1="322" y1="242" x2="376" y2="242" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="322" y1="330" x2="376" y2="310" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="322" y1="330" x2="376" y2="358" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="322" y1="330" x2="376" y2="406" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="190" y1="452" x2="190" y2="478" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="60" y="480" width="260" height="56" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="190.0" y="499.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">LM head → softmax → 采样</text><text x="190.0" y="519.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">得到下一个 token</text><rect x="380" y="480" width="240" height="56" rx="8" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="500.0" y="499.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">DSpark 草稿头</text><text x="500.0" y="519.0" font-size="12" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">一次猜多个 token</text><line x1="322" y1="508" x2="376" y2="508" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="190" y="566" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">循环：新 token 回到输入，进入下一轮 decode</text></svg>
