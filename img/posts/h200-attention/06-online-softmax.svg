<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>在线 softmax 的逐块累加</title><desc>一个 query 对 8 个 key 的分数分 4 块读入。每块更新最大值 m、分母 l、分子 O；出现更大分数时旧的累加整体乘缩放系数（换单位）。最后 O÷l 与一次性 softmax 结果相同。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="420" rx="10" fill="#FFFFFF"/><text x="40" y="24" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">读入的块</text><text x="200" y="24" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">l 的组成：每段是一个 key 在当前单位下的权重 e^(s−m)</text><text x="530" y="24" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">片上状态</text><text x="40" y="62" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">块 0</text><text x="40" y="84" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">s = 1.2, 0.3</text><text x="40" y="102" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">V = 2, -1</text><rect x="200" y="66" width="300" height="26" rx="4" fill="#F1EFE8" fill-opacity="1" stroke="#D3D1C7" stroke-width="0.6"/><rect x="200" y="66" width="136.36363636363635" height="26" rx="2" fill="#1D9E75" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="268.1818181818182" y="79" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">1.00</text><rect x="336.3636363636364" y="66" width="55.441317237354426" height="26" rx="2" fill="#1D9E75" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="364.08429498231357" y="79" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">0.41</text><text x="530" y="62" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">m = 1.20</text><text x="530" y="84" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">l = 1.41</text><text x="530" y="104" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">O = 1.59</text><text x="40" y="134" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">块 1</text><text x="40" y="156" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">s = 2.1, -0.5</text><text x="40" y="174" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">V = 4, 0</text><text x="200" y="126" font-size="11" fill="#854F0B" font-weight="400" text-anchor="start" dominant-baseline="central">出现更大分数：旧段 × e^(m旧−m新) = 0.41（换单位）</text><rect x="200" y="138" width="300" height="26" rx="4" fill="#F1EFE8" fill-opacity="1" stroke="#D3D1C7" stroke-width="0.6"/><rect x="200" y="138" width="55.44131723735441" height="26" rx="2" fill="#FAC775" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="227.7206586186772" y="151" font-size="11" fill="#412402" font-weight="400" text-anchor="middle" dominant-baseline="central">0.41</text><rect x="255.4413172373544" y="138" width="22.540757484761798" height="26" rx="2" fill="#FAC775" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="277.9820747221162" y="138" width="136.36363636363635" height="26" rx="2" fill="#1D9E75" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="346.16389290393437" y="151" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">1.00</text><rect x="414.34571108575255" y="138" width="10.128215211045527" height="26" rx="2" fill="#1D9E75" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="530" y="134" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">m = 2.10</text><text x="530" y="156" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">l = 1.65</text><text x="530" y="176" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">O = 4.65</text><text x="40" y="206" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">块 2</text><text x="40" y="228" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">s = 0.8, 3.0</text><text x="40" y="246" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">V = 3, 1</text><text x="200" y="198" font-size="11" fill="#854F0B" font-weight="400" text-anchor="start" dominant-baseline="central">出现更大分数：旧段 × e^(m旧−m新) = 0.41（换单位）</text><rect x="200" y="210" width="300" height="26" rx="4" fill="#F1EFE8" fill-opacity="1" stroke="#D3D1C7" stroke-width="0.6"/><rect x="200" y="210" width="22.540757484761798" height="26" rx="2" fill="#FAC775" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="222.5407574847618" y="210" width="9.164388100874968" height="26" rx="2" fill="#FAC775" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="231.70514558563676" y="210" width="55.441317237354426" height="26" rx="2" fill="#FAC775" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="259.425804204314" y="223" font-size="11" fill="#412402" font-weight="400" text-anchor="middle" dominant-baseline="central">0.41</text><rect x="287.14646282299117" y="210" width="4.117825012134341" height="26" rx="2" fill="#FAC775" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="291.2642878351255" y="210" width="15.109521594863708" height="26" rx="2" fill="#1D9E75" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="306.37380942998925" y="210" width="136.36363636363635" height="26" rx="2" fill="#1D9E75" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="374.55562761180744" y="223" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">1.00</text><text x="530" y="206" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">m = 3.00</text><text x="530" y="228" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">l = 1.78</text><text x="530" y="248" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">O = 3.22</text><text x="40" y="278" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">块 3</text><text x="40" y="300" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">s = 0.1, 1.5</text><text x="40" y="318" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">V = -2, 5</text><text x="200" y="270" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">最大值没变：旧段 × 1，保持不变</text><rect x="200" y="282" width="300" height="26" rx="4" fill="#F1EFE8" fill-opacity="1" stroke="#D3D1C7" stroke-width="0.6"/><rect x="200" y="282" width="22.540757484761798" height="26" rx="2" fill="#9FE1CB" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="222.5407574847618" y="282" width="9.164388100874968" height="26" rx="2" fill="#9FE1CB" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="231.70514558563676" y="282" width="55.441317237354426" height="26" rx="2" fill="#9FE1CB" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="259.425804204314" y="295" font-size="11" fill="#04342C" font-weight="400" text-anchor="middle" dominant-baseline="central">0.41</text><rect x="287.14646282299117" y="282" width="4.117825012134341" height="26" rx="2" fill="#9FE1CB" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="291.2642878351255" y="282" width="15.109521594863708" height="26" rx="2" fill="#9FE1CB" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="306.37380942998925" y="282" width="136.36363636363635" height="26" rx="2" fill="#9FE1CB" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="374.55562761180744" y="295" font-size="11" fill="#04342C" font-weight="400" text-anchor="middle" dominant-baseline="central">1.00</text><rect x="442.7374457936256" y="282" width="7.503166371328258" height="26" rx="2" fill="#1D9E75" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><rect x="450.24061216495386" y="282" width="30.426840020240427" height="26" rx="2" fill="#1D9E75" fill-opacity="1" stroke="#FFFFFF" stroke-width="1"/><text x="465.4540321750741" y="295" font-size="11" fill="#FFFFFF" font-weight="400" text-anchor="middle" dominant-baseline="central">0.22</text><text x="530" y="278" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">m = 3.00</text><text x="530" y="300" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">l = 2.06</text><text x="530" y="320" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">O = 4.23</text><text x="340" y="350" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">输出 = O ÷ l = 4.23 ÷ 2.06 = 2.054，与一次性 softmax 的 2.054 完全相同</text><rect x="120" y="380" width="12" height="12" rx="2" fill="#1D9E75" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="138" y="386" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">本块新加入的权重</text><rect x="280" y="380" width="12" height="12" rx="2" fill="#FAC775" fill-opacity="1" stroke="none" stroke-width="0.8"/><text x="298" 