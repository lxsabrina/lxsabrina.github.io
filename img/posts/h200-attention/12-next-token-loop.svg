<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>从最后一个 token 的向量到下一个 token 的生成循环</title><desc>第 40 层最后一个 token 的向量乘输出矩阵得到 12.9 万个分数，softmax 后采样；新 token 查 embedding，再过 40 层只算这一个位置，复用 KV cache。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="240" rx="10" fill="#FFFFFF"/><rect x="50" y="40" width="130" height="56" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="115.0" y="59.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">最后一个 token</text><text x="115.0" y="79.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">第 40 层的 x</text><line x1="180" y1="68" x2="198" y2="68" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="200" y="40" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="265.0" y="59.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">× 输出矩阵</text><text x="265.0" y="79.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">5120 → 12.9 万</text><line x1="330" y1="68" x2="348" y2="68" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="350" y="40" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="415.0" y="59.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">softmax</text><text x="415.0" y="79.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">分数变概率</text><line x1="480" y1="68" x2="498" y2="68" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="500" y="40" width="130" height="56" rx="8" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="565.0" y="59.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">采样</text><text x="565.0" y="79.0" font-size="12" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">选出一个 token</text><line x1="565" y1="98" x2="565" y2="148" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="440" y="150" width="190" height="56" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="535.0" y="169.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">新 token 查 embedding</text><text x="535.0" y="189.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">成为第 1 层的 x</text><line x1="440" y1="178" x2="392" y2="178" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="150" y="150" width="240" height="56" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="270.0" y="169.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">过 40 层，只算这一个位置</text><text x="270.0" y="189.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">注意力读 KV cache</text><path d="M150 178 L115 178 L115 100" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#arr)"/></svg>
