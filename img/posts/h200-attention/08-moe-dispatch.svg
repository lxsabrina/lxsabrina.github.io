<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>一个 token 在一层 MoE 里的分发与汇总</title><desc>GPU 0 上的 token 经路由选出专家，分发到持有这些专家的 GPU，专家计算后结果发回 GPU 0 加权合并。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="350" rx="10" fill="#FFFFFF"/><rect x="40" y="30" width="150" height="260" rx="12" fill="#EEEDFE" fill-opacity="1" stroke="#534AB7" stroke-width="0.8"/><text x="115" y="50" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">GPU 0</text><rect x="60" y="70" width="110" height="40" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="115.0" y="90.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">token</text><line x1="115" y1="112" x2="115" y2="128" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="60" y="130" width="110" height="50" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="115.0" y="146.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">路由 top-k</text><text x="115.0" y="166.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">DeepSelect</text><rect x="60" y="222" width="110" height="50" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="115.0" y="238.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">加权合并</text><text x="115.0" y="258.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">DeepEP combine</text><rect x="370" y="30" width="270" height="80" rx="12" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="505" y="52" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">GPU 1</text><text x="505" y="80" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">专家 17、203：DeepGEMM 计算</text><line x1="192" y1="58" x2="368" y2="58" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="368" y1="86" x2="192" y2="86" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="370" y="120" width="270" height="80" rx="12" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="505" y="142" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">GPU 2</text><text x="505" y="170" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">专家 88、121：DeepGEMM 计算</text><line x1="192" y1="148" x2="368" y2="148" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="368" y1="176" x2="192" y2="176" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="370" y="210" width="270" height="80" rx="12" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="505" y="232" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">GPU 3</text><text x="505" y="260" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">专家 301、350：DeepGEMM 计算</text><line x1="192" y1="238" x2="368" y2="238" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><line x1="368" y1="266" x2="192" y2="266" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="280" y="22" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">dispatch：发出 token（DeepEP）</text><text x="280" y="304" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">combine：结果发回</text><text x="340" y="334" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">示意：专家编号和所在 GPU 是假设的；真实模型每个 token 从 384 个专家里选 6 个</text></svg>
