<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>普通注意力与 FlashAttention 的显存读写对比</title><desc>普通写法把 N×N 的分数矩阵写回显存再读出；FlashAttention 把整套计算留在片上缓存，只读输入、写输出。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="250" rx="10" fill="#FFFFFF"/><text x="40" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">普通写法：每个算子的中间结果都经过显存</text><rect x="40" y="38" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="92.0" y="53.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">显存</text><text x="92.0" y="73.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Q、K、V</text><line x1="144" y1="62" x2="162" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="164" y="38" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="216.0" y="53.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">算 Q×K</text><text x="216.0" y="73.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">得到 S</text><line x1="268" y1="62" x2="286" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="288" y="38" width="104" height="48" rx="8" fill="#FAECE7" fill-opacity="1" stroke="#993C1D" stroke-width="0.8"/><text x="340.0" y="53.0" font-size="14" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">写回显存</text><text x="340.0" y="73.0" font-size="12" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">S、P 都是 N×N</text><line x1="392" y1="62" x2="410" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="412" y="38" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="464.0" y="53.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">读回再算</text><text x="464.0" y="73.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">softmax、×V</text><line x1="516" y1="62" x2="534" y2="62" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="536" y="38" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="588.0" y="53.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">输出</text><text x="588.0" y="73.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">写回显存</text><text x="40" y="128" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">FlashAttention：中间结果始终留在片上</text><rect x="40" y="144" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="92.0" y="159.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">显存</text><text x="92.0" y="179.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Q、K、V 小块</text><line x1="144" y1="168" x2="162" y2="168" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="164" y="144" width="348" height="48" rx="8" fill="#E1F5EE" fill-opacity="1" stroke="#0F6E56" stroke-width="0.8"/><text x="338.0" y="159.0" font-size="14" fill="#085041" font-weight="500" text-anchor="middle" dominant-baseline="central">片上缓存（SRAM）</text><text x="338.0" y="179.0" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">Q×K → 在线 softmax → ×V，一气呵成</text><line x1="512" y1="168" x2="534" y2="168" stroke="#73726C" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arr)"/><rect x="536" y="144" width="104" height="48" rx="8" fill="#F1EFE8" fill-opacity="1" stroke="#888780" stroke-width="0.8"/><text x="588.0" y="159.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">输出</text><text x="588.0" y="179.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">写回显存</text><text x="338" y="222" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">对 K、V 一块接一块循环，分数和权重算完即丢，不落显存</text></svg>
