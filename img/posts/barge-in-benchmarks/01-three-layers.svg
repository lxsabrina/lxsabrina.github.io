<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" width="680" height="256" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>一次打断，三个层次</title><desc>示意图：按“评测对象”归类这四个基准，归类是作者自己的整理。</desc>
<rect x="0.5" y="0.5" width="679" height="255" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="36" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">一次打断，三个层次</text><rect x="24" y="58" width="210" height="150" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="129" y="86" font-size="14" fill="#534AB7" text-anchor="middle" font-weight="bold">1 能不能停对</text><text x="129" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal">检测与响应</text><text x="129" y="146" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">SID-Bench</text><text x="129" y="172" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">该停还是该继续？停得多快？</text><rect x="242" y="58" width="210" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="347" y="86" font-size="14" fill="#0F6E56" text-anchor="middle" font-weight="bold">2 停了以后说什么</text><text x="347" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal">恢复与状态更新</text><text x="347" y="146" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">EchoChain · IHBench</text><text x="347" y="172" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">是否吸收新信息？回到正确</text><text x="347" y="189" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">步骤？</text><rect x="460" y="58" width="210" height="150" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="565" y="86" font-size="14" fill="#993C1D" text-anchor="middle" font-weight="bold">3 按谁的规矩打断</text><text x="565" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal">策略与可控性</text><text x="565" y="146" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Instruct-FD</text><text x="565" y="172" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">能否按指令改变插话、附和</text><text x="565" y="189" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">行为？</text><text x="340" y="240" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">示意图：按“评测对象”归类这四个基准，归类是作者自己的整理。</text></svg>