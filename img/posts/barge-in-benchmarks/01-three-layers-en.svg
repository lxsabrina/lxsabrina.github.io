<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" width="680" height="256" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>One interruption, three layers</title><desc>An illustration: the four benchmarks grouped by what they measure; the grouping is my own.</desc>
<rect x="0.5" y="0.5" width="679" height="255" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="36" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">One interruption, three layers</text><rect x="24" y="58" width="210" height="150" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="129" y="86" font-size="14" fill="#534AB7" text-anchor="middle" font-weight="bold">1 Stop correctly</text><text x="129" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Detect and respond</text><text x="129" y="146" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">SID-Bench</text><text x="129" y="172" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Stop or keep going? How</text><text x="129" y="189" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">fast?</text><rect x="242" y="58" width="210" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="347" y="86" font-size="14" fill="#0F6E56" text-anchor="middle" font-weight="bold">2 What to say next</text><text x="347" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Recover and update state</text><text x="347" y="146" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">EchoChain · IHBench</text><text x="347" y="172" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Use the new info? Resume at</text><text x="347" y="189" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">the right step?</text><rect x="460" y="58" width="210" height="150" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="565" y="86" font-size="14" fill="#993C1D" text-anchor="middle" font-weight="bold">3 Whose rules</text><text x="565" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Policy and control</text><text x="565" y="146" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Instruct-FD</text><text x="565" y="172" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Can it change barge-in /</text><text x="565" y="189" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">backchannel on instruction?</text><text x="340" y="240" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">An illustration: the four benchmarks grouped by what they measure; the grouping is my own.</text></svg>