<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>SID-Bench 的 APT：每种结果怎么扣分</title><desc>APT = 所有测试样例罚时的平均值（单位：秒）。依据论文对指标的文字描述整理。</desc>
<rect x="0.5" y="0.5" width="679" height="299" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="34" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">SID-Bench 的 APT：每种结果怎么扣分</text><text x="30" y="70" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="bold">实际情况</text><text x="230" y="70" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="bold">系统动作</text><text x="430" y="70" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="bold">罚时</text><rect x="24" y="82" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="30" y="106" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">用户真打断</text><text x="230" y="106" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">及时停下 (TP)</text><text x="430" y="106" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">响应延迟 IRL</text><rect x="24" y="128" width="632" height="38" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="30" y="152" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">用户只是附和/噪声</text><text x="230" y="152" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">误停 (FP)</text><text x="430" y="152" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">整轮播报时长</text><rect x="24" y="174" width="632" height="38" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="30" y="198" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">用户真打断</text><text x="230" y="198" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">没停 (FN)</text><text x="430" y="198" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">不该播的音频时长</text><rect x="24" y="220" width="632" height="38" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="30" y="244" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">附和/噪声</text><text x="230" y="244" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">继续说 (TN)</text><text x="430" y="244" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">0</text><text x="340" y="284" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">APT = 所有测试样例罚时的平均值（单位：秒）。依据论文对指标的文字描述整理。</text></svg>