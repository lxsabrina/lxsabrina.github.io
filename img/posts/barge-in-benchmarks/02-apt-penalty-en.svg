<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>SID-Bench APT: how each outcome is penalised</title><desc>APT = mean penalty over all test cases (seconds). Summarised from the paper's textual description.</desc>
<rect x="0.5" y="0.5" width="679" height="299" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="34" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">SID-Bench APT: how each outcome is penalised</text><text x="30" y="70" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="bold">Ground truth</text><text x="230" y="70" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="bold">System action</text><text x="430" y="70" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="bold">Penalty</text><rect x="24" y="82" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="30" y="106" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">True interruption</text><text x="230" y="106" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">Stops in time (TP)</text><text x="430" y="106" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">Response latency IRL</text><rect x="24" y="128" width="632" height="38" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="30" y="152" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">Backchannel / noise</text><text x="230" y="152" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">Stops (FP)</text><text x="430" y="152" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">Whole turn duration</text><rect x="24" y="174" width="632" height="38" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="30" y="198" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">True interruption</text><text x="230" y="198" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">Keeps talking (FN)</text><text x="430" y="198" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">Unwanted audio duration</text><rect x="24" y="220" width="632" height="38" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="30" y="244" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">Backchannel / noise</text><text x="230" y="244" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">Keeps talking (TN)</text><text x="430" y="244" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="normal">0</text><text x="340" y="284" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">APT = mean penalty over all test cases (seconds). Summarised from the paper's textual description.</text></svg>