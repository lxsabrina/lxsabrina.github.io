<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Mem0 2.2.1 write and search paths</title><desc>Write: recent messages and similar old memories go to one LLM extraction call, MD5 dedup, then vector and entity stores. Search: semantic candidate pool, BM25 and entity boosts, threshold gate, combine, optional rerank.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="330" rx="10" fill="#FFFFFF"/><text x="24" y="30" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Write  add()</text><rect x="24" y="44" width="108" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.0"/><text x="78" y="64" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Last 10 messages</text><text x="78" y="82" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">+ the new turn</text><path d="M134 72L153 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="155" y="44" width="108" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.0"/><text x="209" y="64" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Fetch 10 similar</text><text x="209" y="82" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">old memories (hint)</text><path d="M265 72L284 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-en