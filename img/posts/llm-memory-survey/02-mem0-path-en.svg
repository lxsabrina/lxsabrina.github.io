188" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">optional rerank</text><rect x="24" y="232" width="632" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340" y="249" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Combine: (semantic + BM25 + entity) / ceiling; ceiling 1.0 / 1.5 / 2.0 / 2.5 depending on active signals</text><rect x="24" y="276" width="632" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340" y="293" font-size="11.5" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">BM25 and entity only rescore the semantic pool; no recency or validity term; conflicting facts coexist</text></svg>