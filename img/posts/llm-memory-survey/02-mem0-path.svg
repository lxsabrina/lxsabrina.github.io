<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Mem0 2.2.1 的写入与检索路径</title><desc>写入：最近消息与相似旧记忆交给一次 LLM 抽取，MD5 去重后入向量库与实体库。检索：语义候选池，叠加 BM25 与实体分，阈值先过滤，再合并、可选重排。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="330" rx="10" fill="#FFFFFF"/><text x="24" y="30" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">写入  add()</text><rect x="24" y="44" width="108" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.0"/><text x="78" y="64" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">最近 10 条消息</text><text x="78" y="82" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">+ 新一轮对话</text><path d="M134 72L153 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="155" y="44" width="108" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.0"/><text x="209" y="64" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">取 10 条相似</text><text x="209" y="82" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">已有记忆（参考）</text><path d="M265 72L284 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="286" y="44" width="108" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.0"/><text x="340" y="64" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">一次 LLM 抽取</text><text x="340" y="82" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">只新增，带链接</text><path d="M396 72L415 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="417" y="44" width="108" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.0"/><text x="471" y="64" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">MD5 精确去重</text><text x="471" y="82" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">文本哈希</text><path d="M527 72L546 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="548" y="44" width="108" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.0"/><text x="602" y="64" font-size="12" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">入库</text><text x="602" y="82" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">向量库 + 实体库</text><text x="24" y="136" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">检索  search()</text><rect x="24" y="150" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/><text x="78" y="170" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">查询 + filters</text><text x="78" y="188" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">必须带作用域</text><path d="M134 178L153 178" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="155" y="150" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/><text x="209" y="170" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">语义候选池</text><text x="209" y="188" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">max(4×limit, 60)</text><path d="M265 178L284 178" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="286" y="150" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/><text x="340" y="170" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">BM25 + 实体分</text><text x="340" y="188" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">sigmoid；权重 0.5</text><path d="M396 178L415 178" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="417" y="150" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/><text x="471" y="170" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">语义阈值 0.1</text><text x="471" y="188" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">先过滤再合并</text><path d="M527 178L546 178" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="548" y="150" width="108" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/><text x="602" y="170" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">合并 → top-k</text><text x="602" y="188" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">可选 rerank</text><rect x="24" y="232" width="632" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340" y="249" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">合并：(语义 + BM25 + 实体) ÷ 上界；上界 1.0 / 1.5 / 2.0 / 2.5，随启用的信号变化</text><rect x="24" y="276" width="632" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340" y="293" font-size="11.5" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">BM25 与实体分只给语义池内的候选加分；评分里没有近因或有效期项；冲突的新旧事实会并存</text></svg>