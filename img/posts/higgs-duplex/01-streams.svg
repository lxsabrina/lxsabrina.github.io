<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>一个模型，多条并行流（示意图）</title><desc>示意图：输入流切成 160 ms 块进入前端模型，输出语音与人脸，并异步调用工具与后端模型</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="315" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="34" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">一个模型，多条并行流（示意图）</text>
<rect x="20" y="56" width="130" height="38" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="85.0" y="79.0" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">用户语音</text>
<line x1="150" y1="75" x2="205" y2="107.0" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="102" width="130" height="38" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="85.0" y="125.0" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">摄像头 / 屏幕</text>
<line x1="150" y1="121" x2="205" y2="121.0" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="148" width="130" height="38" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="85.0" y="171.0" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">工具结果</text>
<line x1="150" y1="167" x2="205" y2="135.0" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="194" width="130" height="38" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="85.0" y="217.0" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">后端回复</text>
<line x1="150" y1="213" x2="205" y2="149.0" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="210" y="86" width="170" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="295.0" y="127.0" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">前端模型</text>
<text x="295.0" y="144.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">45B MoE</text>
<rect x="450" y="56" width="210" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="555.0" y="78.0" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">音频解码器</text>
<text x="555.0" y="95.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">因果 flow matching</text>
<rect x="450" y="112" width="210" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="555.0" y="134.0" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">视频解码器</text>
<text x="555.0" y="151.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">因果 DiT</text>
<line x1="380" y1="115" x2="450" y2="80" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="380" y1="145" x2="450" y2="136" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<text x="555" y="48" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="normal"></text>
<rect x="210" y="206" width="170" height="40" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="295.0" y="230.0" font-size="12.5" fill="#993C1D" text-anchor="middle" font-weight="bold">工具（异步）</text>
<rect x="450" y="206" width="210" height="40" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="555.0" y="230.0" font-size="12.5" fill="#993C1D" text-anchor="middle" font-weight="bold">后端大模型</text>
<text x="555" y="266" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">共享上下文，慢速推理</text>
<line x1="295" y1="172" x2="295" y2="206" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="380" y1="226" x2="450" y2="226" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="340" y="298" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal">全部按 160 ms 切块，静音也是一块</text>
</svg>