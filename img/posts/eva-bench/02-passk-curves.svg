<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>pass@k 与 pass^k</title><desc>示意图：单个场景每次通过概率 p 固定时，随试验数 k 变化</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="339" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="28" font-size="15" fill="#2C2C2A" text-anchor="middle" font-weight="bold">同一个场景，试验次数 k 增加时（示意图）</text>
<line x1="70" y1="260" x2="610" y2="260" stroke="#E3E1D8"/><text x="62" y="264" font-size="10.5" fill="#5F5E5A" text-anchor="end">0.00</text>
<line x1="70" y1="210.0" x2="610" y2="210.0" stroke="#E3E1D8"/><text x="62" y="214.0" font-size="10.5" fill="#5F5E5A" text-anchor="end">0.25</text>
<line x1="70" y1="160.0" x2="610" y2="160.0" stroke="#E3E1D8"/><text x="62" y="164.0" font-size="10.5" fill="#5F5E5A" text-anchor="end">0.50</text>
<line x1="70" y1="110.0" x2="610" y2="110.0" stroke="#E3E1D8"/><text x="62" y="114.0" font-size="10.5" fill="#5F5E5A" text-anchor="end">0.75</text>
<line x1="70" y1="60" x2="610" y2="60" stroke="#E3E1D8"/><text x="62" y="64" font-size="10.5" fill="#5F5E5A" text-anchor="end">1.00</text>
<text x="70.0" y="278" font-size="11" fill="#5F5E5A" text-anchor="middle">1</text>
<text x="205.0" y="278" font-size="11" fill="#5F5E5A" text-anchor="middle">2</text>
<text x="340.0" y="278" font-size="11" fill="#5F5E5A" text-anchor="middle">3</text>
<text x="475.0" y="278" font-size="11" fill="#5F5E5A" text-anchor="middle">4</text>
<text x="610.0" y="278" font-size="11" fill="#5F5E5A" text-anchor="middle">5</text>
<text x="340.0" y="296" font-size="11" fill="#5F5E5A" text-anchor="middle">试验次数 k</text>
<polyline points="70.0,80.0 205.0,62.0 340.0,60.2 475.0,60.0 610.0,60.0" fill="none" stroke="#0F6E56" stroke-width="2" stroke-dasharray="5 4"/><polyline points="70.0,80.0 205.0,98.0 340.0,114.2 475.0,128.8 610.0,141.9" fill="none" stroke="#0F6E56" stroke-width="2"/>
<text x="616" y="145.902" font-size="11" fill="#0F6E56" text-anchor="start" font-weight="bold">p=0.9</text>
<polyline points="70.0,120.0 205.0,78.0 340.0,65.4 475.0,61.6 610.0,60.5" fill="none" stroke="#534AB7" stroke-width="2" stroke-dasharray="5 4"/><polyline points="70.0,120.0 205.0,162.0 340.0,191.4 475.0,212.0 610.0,226.4" fill="none" stroke="#534AB7" stroke-width="2"/>
<text x="616" y="230.38600000000002" font-size="11" fill="#534AB7" text-anchor="start" font-weight="bold">p=0.7</text>
<polyline points="70.0,160.0 205.0,110.0 340.0,85.0 475.0,72.5 610.0,66.2" fill="none" stroke="#993C1D" stroke-width="2" stroke-dasharray="5 4"/><polyline points="70.0,160.0 205.0,210.0 340.0,235.0 475.0,247.5 610.0,253.8" fill="none" stroke="#993C1D" stroke-width="2"/>
<text x="616" y="257.75" font-size="11" fill="#993C1D" text-anchor="start" font-weight="bold">p=0.5</text>
<line x1="70" y1="320" x2="100" y2="320" stroke="#2C2C2A" stroke-width="2" stroke-dasharray="5 4"/><text x="106" y="324" font-size="11" fill="#2C2C2A" text-anchor="start">pass@k = 1 − (1−p)^k（至少一次通过）</text>
<line x1="400" y1="320" x2="430" y2="320" stroke="#2C2C2A" stroke-width="2"/><text x="436" y="324" font-size="11" fill="#2C2C2A" text-anchor="start">pass^k = p^k（全部通过）</text>
</svg>
