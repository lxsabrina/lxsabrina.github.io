<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>The EVA-Bench pipeline</title><desc>An illustration of scenario, user simulator, agent under test, validation and scoring</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="299" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="30" font-size="15" fill="#2C2C2A" text-anchor="middle" font-weight="bold">The EVA-Bench pipeline (illustration)</text>
<rect x="20" y="60" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="85" y="86" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Scenario</text>
<text x="85" y="106" font-size="11" fill="#5F5E5A" text-anchor="middle">goal, persona, tree</text>
<rect x="190" y="60" width="140" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="260" y="86" font-size="13" fill="#534AB7" text-anchor="middle" font-weight="bold">User simulator</text>
<text x="260" y="106" font-size="11" fill="#5F5E5A" text-anchor="middle">cascade, audio only</text>
<rect x="370" y="60" width="140" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="440" y="86" font-size="13" fill="#0F6E56" text-anchor="middle" font-weight="bold">Agent under test</text>
<text x="440" y="106" font-size="11" fill="#5F5E5A" text-anchor="middle">cascade/hybrid/S2S</text>
<rect x="550" y="60" width="110" height="70" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="605" y="86" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Tool executor</text>
<text x="605" y="106" font-size="11" fill="#5F5E5A" text-anchor="middle">deterministic</text>
<line x1="150" y1="95" x2="188" y2="95" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="330" y1="85" x2="368" y2="85" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="368" y1="108" x2="332" y2="108" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="510" y1="95" x2="548" y2="95" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="420" y="162" font-size="10.5" fill="#5F5E5A" text-anchor="start">finished conversation</text>
<text x="350" y="146" font-size="10.5" fill="#5F5E5A" text-anchor="end">live audio (WebSocket)</text>
<rect x="190" y="180" width="200" height="70" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="290" y="204" font-size="13" fill="#993C1D" text-anchor="middle" font-weight="bold">Simulator validation</text>
<text x="290" y="223" font-size="10.5" fill="#5F5E5A" text-anchor="middle">user behaviour + speech fidelity</text>
<text x="290" y="239" font-size="10.5" fill="#5F5E5A" text-anchor="middle">fail: regenerate</text>
<rect x="450" y="180" width="210" height="70" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="555" y="204" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Scoring</text>
<text x="555" y="223" font-size="10.5" fill="#5F5E5A" text-anchor="middle">EVA-A  EVA-X  diagnostics</text>
<text x="555" y="239" font-size="10.5" fill="#5F5E5A" text-anchor="middle">pass@1  pass@k  pass^k</text>
<line x1="440" y1="132" x2="330" y2="178" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="390" y1="215" x2="448" y2="215" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M190 215 C150 215 150 150 190 130" fill="none" stroke="#993C1D" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="120" y="270" font-size="10.5" fill="#5F5E5A" text-anchor="middle">Source: paper Figure 1, simplified by me</text>
</svg>
