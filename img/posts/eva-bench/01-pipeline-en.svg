<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>EVA-Bench pipeline (redrawn from the paper's Fig. 1)</title><desc>Scenario, user simulator and voice agent talk over audio; conversations are validated, then scored</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="379" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340.0" y="30" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">EVA-Bench pipeline (redrawn from the paper's Fig. 1)</text>
<rect x="20" y="56" width="150" height="78" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="95.0" y="83.0" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Scenario</text>
<text x="95.0" y="99.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">goal + decision tree</text>
<text x="95.0" y="115.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">persona, DB, ground truth</text>
<rect x="215" y="56" width="130" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="280.0" y="91.0" font-size="12" fill="#534AB7" text-anchor="middle" font-weight="bold">User simulator</text>
<text x="280.0" y="107.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">(STT-LLM-TTS)</text>
<rect x="390" y="56" width="130" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="455.0" y="91.0" font-size="12" fill="#534AB7" text-anchor="middle" font-weight="bold">Voice agent</text>
<text x="455.0" y="107.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">cascade / hybrid / S2S</text>
<rect x="545" y="56" width="115" height="78" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="602.5" y="91.0" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Tool executor</text>
<text x="602.5" y="107.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">deterministic</text>
<line x1="170" y1="95" x2="213" y2="95" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="347" y1="84" x2="388" y2="84" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="388" y1="106" x2="347" y2="106" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<text x="367" y="74" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="normal">audio</text>
<line x1="520" y1="95" x2="543" y2="95" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="215" y="170" width="305" height="60" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="367.5" y="196.0" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="bold">Simulator validation (before scoring)</text>
<text x="367.5" y="212.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">did the user drift from its goal · was its speech correct</text>
<line x1="367" y1="134" x2="367" y2="168" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="170" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="95.0" y="196.0" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Regenerate</text>
<text x="95.0" y="212.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">rerun on failure</text>
<line x1="213" y1="200" x2="172" y2="200" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="192" y="192" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="normal">fail</text>
<rect x="60" y="268" width="255" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="187.5" y="297.0" font-size="12" fill="#0F6E56" text-anchor="middle" font-weight="bold">EVA-A Accuracy</text>
<text x="187.5" y="313.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Task completion · Faithfulness · Speech fidelity</text>
<rect x="340" y="268" width="255" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="467.5" y="297.0" font-size="12" fill="#0F6E56" text-anchor="middle" font-weight="bold">EVA-X Experience</text>
<text x="467.5" y="313.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Turn-taking · Progression · Conciseness</text>
<line x1="300" y1="230" x2="200" y2="266" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="440" y1="230" x2="460" y2="266" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<text x="535" y="205" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="normal">pass</text>
<text x="340" y="358" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Each conversation passes or fails per dimension; results aggregate into pass@1 / pass@k / pass^k</text>
</svg>
