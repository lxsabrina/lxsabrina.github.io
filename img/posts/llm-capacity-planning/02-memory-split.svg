<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 224" width="680" height="224" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>一张 80 GB 卡的显存去向</title><desc>Qwen3-8B BF16 的算例：预留、权重、激活与 KV cache 的划分，其中预留和激活为假设值。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="223" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="34" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">一张 80 GB 卡的显存去向</text><rect x="30" y="70" width="62.0" height="56" rx="4" fill="#F1EFE8" stroke="#888780"/><text x="61.0" y="146" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="bold">框架预留 10%</text><text x="61.0" y="162" font-size="10.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">8.0 GB</text><rect x="92.0" y="70" width="126.94499999999998" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="155.4725" y="94" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">权重 BF16</text><text x="155.4725" y="114" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">16.4 GB</text><rect x="218.945" y="70" width="38.75" height="56" rx="4" fill="#F1EFE8" stroke="#888780"/><text x="238.32" y="146" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="bold">激活/图等</text><text x="238.32" y="162" font-size="10.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">5 GB（假设）</text><rect x="257.695" y="70" width="392.30499999999995" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="453.84749999999997" y="94" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">KV cache</text><text x="453.84749999999997" y="114" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">50.6 GB</text><text x="30" y="62" font-size="10" fill="#5F5E5A" text-anchor="start" font-weight="normal">0</text><text x="650" y="62" font-size="10" fill="#5F5E5A" text-anchor="end" font-weight="normal">80 GB</text><text x="340" y="200" font-size="11.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">KV 50.6 GB ÷ 144 KiB ≈ 34.3 万 token；每请求平均驻留 2,250 token → 约 152 路并发</text></svg>
