<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 228" width="680" height="228" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>Five steps of the estimate</title><desc>An illustration: from the model config and hardware specs to goodput under SLOs in five steps.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="227" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="34" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Five steps of the estimate</text><rect x="21.0" y="58" width="118" height="112" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="80.0" y="84" font-size="13.5" fill="#534AB7" text-anchor="middle" font-weight="bold">1 Weights</text><text x="80.0" y="114" font-size="10.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">params × bytes</text><text x="80.0" y="136" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">8.19B × 2 = 16.4 GB</text><line x1="140.0" y1="114" x2="150.0" y2="114" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/><rect x="151.0" y="58" width="118" height="112" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="210.0" y="84" font-size="13.5" fill="#534AB7" text-anchor="middle" font-weight="bold">2 KV/token</text><text x="210.0" y="114" font-size="10.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">2·layers·kv·dim·bytes</text><text x="210.0" y="136" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">144 KiB / token</text><line x1="270.0" y1="114" x2="280.0" y2="114" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/><rect x="281.0" y="58" width="118" height="112" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="340.0" y="84" font-size="13.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">3 KV budget</text><text x="340.0" y="114" font-size="10.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">HBM − reserve − W</text><text x="340.0" y="136" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">≈ 50.6 GB → 343K tok</text><line x1="400.0" y1="114" x2="410.0" y2="114" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/><rect x="411.0" y="58" width="118" height="112" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="470.0" y="84" font-size="13.5" fill="#993C1D" text-anchor="middle" font-weight="bold">4 Step time</text><text x="470.0" y="114" font-size="10.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">max(bytes / BW,</text><text x="470.0" y="136" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">FLOPs / compute)</text><line x1="530.0" y1="114" x2="540.0" y2="114" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/><rect x="541.0" y="58" width="118" height="112" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="600.0" y="84" font-size="13.5" fill="#993C1D" text-anchor="middle" font-weight="bold">5 Goodput</text><text x="600.0" y="114" font-size="10.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">arrival rate + SLOs</text><text x="600.0" y="136" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">first limit to bind</text><text x="340" y="204" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Inputs: model config.json, GPU spec sheet, traffic shape (prompt/output length), SLOs (TTFT, TPOT)</text></svg>
