<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>合规的五个层次</title><desc>示意图：评测一个 Agent 是否合规时可以检查的五个层次</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="371" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="28" font-size="15" fill="#2C2C2A" text-anchor="middle" font-weight="bold">合规评测可以检查的五个层次（示意图）</text>
<text x="120" y="58" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="bold">层次</text>
<text x="300" y="58" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="bold">问什么</text>
<text x="450" y="58" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="bold">怎么判</text>
<text x="595" y="58" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="bold">代表工作</text>
<rect x="14" y="68" width="652" height="50" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="24" y="98" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="bold">1 最终状态</text>
<text x="220" y="98" font-size="11" fill="#2C2C2A" text-anchor="start">结果是否正确</text>
<text x="400" y="98" font-size="11" fill="#2C2C2A" text-anchor="start">数据库状态对比</text>
<text x="540" y="98" font-size="11" fill="#5F5E5A" text-anchor="start">τ-bench 等</text>
<rect x="14" y="126" width="652" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="24" y="156" font-size="13" fill="#534AB7" text-anchor="start" font-weight="bold">2 动作许可</text>
<text x="220" y="156" font-size="11" fill="#2C2C2A" text-anchor="start">每次调用是否被允许</text>
<text x="400" y="156" font-size="11" fill="#2C2C2A" text-anchor="start">规则校验器 / Oracle</text>
<text x="540" y="156" font-size="11" fill="#5F5E5A" text-anchor="start">SOPBench 等</text>
<rect x="14" y="184" width="652" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="24" y="214" font-size="13" fill="#0F6E56" text-anchor="start" font-weight="bold">3 顺序与完整</text>
<text x="220" y="214" font-size="11" fill="#2C2C2A" text-anchor="start">必需步骤是否做全、顺序对</text>
<text x="400" y="214" font-size="11" fill="#2C2C2A" text-anchor="start">轨迹匹配 / 时序逻辑</text>
<text x="540" y="214" font-size="11" fill="#5F5E5A" text-anchor="start">JourneyBench 等</text>
<rect x="14" y="242" width="652" height="50" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="24" y="272" font-size="13" fill="#993C1D" text-anchor="start" font-weight="bold">4 参数与话术</text>
<text x="220" y="272" font-size="11" fill="#2C2C2A" text-anchor="start">参数值、披露与措辞</text>
<text x="400" y="272" font-size="11" fill="#2C2C2A" text-anchor="start">精确匹配 + LLM 评审</text>
<text x="540" y="272" font-size="11" fill="#5F5E5A" text-anchor="start">SAGE 等</text>
<rect x="14" y="300" width="652" height="50" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="24" y="330" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="bold">5 稳健与可靠</text>
<text x="220" y="330" font-size="11" fill="#2C2C2A" text-anchor="start">施压、模拟器错误、多次试验</text>
<text x="400" y="330" font-size="11" fill="#2C2C2A" text-anchor="start">pass^k + 对抗用例</text>
<text x="540" y="330" font-size="11" fill="#5F5E5A" text-anchor="start">τ-bench 等</text>
</svg>
