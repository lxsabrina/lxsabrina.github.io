<text x="90" y="203" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">线上 trace</text>
<text x="90" y="223" font-size="10.5" fill="#5F5E5A" text-anchor="middle">真实对话</text>
<line x1="161" y1="208" x2="183" y2="208" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="185" y="178" width="140" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="255" y="203" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">规则</text>
<text x="255" y="223" font-size="10.5" fill="#5F5E5A" text-anchor="middle">过滤 + 抽样</text>
