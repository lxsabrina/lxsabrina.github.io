<rect x="350" y="178" width="140" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="420" y="203" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">评估器</text>
<text x="420" y="223" font-size="10.5" fill="#5F5E5A" text-anchor="middle">代码 / LLM 评审</text>
<line x1="491" y1="208" x2="513" y2="208" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="515" y="178" width="140" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="585" y="203" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">标注队列</text>
<text x="585" y="223" font-size="10.5" fill="#5F5E5A" text-anchor="middle">人工复核</text>
<path d="M575 240 V262 H8 V98 H18" fill="none" stroke="#993C1D" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="340" y="278" font-size="11" fill="#993C1D" text-anchor="middle">失败案例回流进数据集；人工标签用来校准评审</text>
<text x="340" y="312" font-size="10.5" fill="#5F5E5A" text-anchor="middle">结构依据 Langfuse 文档，简化</text>
