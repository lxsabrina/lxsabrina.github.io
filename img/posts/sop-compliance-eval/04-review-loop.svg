<rect x="350" y="68" width="140" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="420" y="93" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">打分</text>
<text x="420" y="113" font-size="10.5" fill="#5F5E5A" text-anchor="middle">代码检查 + 评审</text>
<line x1="491" y1="98" x2="513" y2="98" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="515" y="68" width="140" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="585" y="93" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">回归门槛</text>
<text x="585" y="113" font-size="10.5" fill="#5F5E5A" text-anchor="middle">低于阈值则失败</text>
