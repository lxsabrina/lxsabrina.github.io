<rect x="0.5" y="0.5" width="679" height="329" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="28" font-size="15" fill="#2C2C2A" text-anchor="middle" font-weight="bold">离线实验 + 线上评测的闭环（示意图）</text>
<text x="20" y="58" font-size="12" fill="#534AB7" text-anchor="start" font-weight="bold">离线</text>
