<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>One trajectory, three checks</title><desc>An illustration of the three evaluation dimensions in SOPBench</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="299" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="28" font-size="15" fill="#2C2C2A" text-anchor="middle" font-weight="bold">One trajectory, three rule-based checks (illustration)</text>
<rect x="20" y="60" width="150" height="70" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="95" y="86" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">SOP code (oracle)</text>
<text x="95" y="106" font-size="10.5" fill="#5F5E5A" text-anchor="middle">verifiers + action graph</text>
<rect x="20" y="170" width="150" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="95" y="196" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">Agent's tool-call trace</text>
<text x="95" y="216" font-size="10.5" fill="#5F5E5A" text-anchor="middle">call sequence + final DB state</text>
<rect x="260" y="50" width="260" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="390" y="75" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">1 Action permitted?</text>
<text x="390" y="94" font-size="10.5" fill="#5F5E5A" text-anchor="middle">every call met its preconditions</text>
<line x1="172" y1="95" x2="258" y2="80" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="172" y1="205" x2="258" y2="80" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="260" y="125" width="260" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="390" y="150" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">2 Outcome matches?</text>
<text x="390" y="169" font-size="10.5" fill="#5F5E5A" text-anchor="middle">final DB state = oracle state</text>
<line x1="172" y1="95" x2="258" y2="155" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="172" y1="205" x2="258" y2="155" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="260" y="200" width="260" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="390" y="225" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">3 Procedure complete?</text>
<text x="390" y="244" font-size="10.5" fill="#5F5E5A" text-anchor="middle">required helper calls preceded each action</text>
<line x1="172" y1="95" x2="258" y2="230" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="172" y1="205" x2="258" y2="230" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="560" y="110" width="100" height="80" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="610" y="142" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="bold">all three</text>
<text x="610" y="160" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="bold">to pass</text>
<line x1="522" y1="80" x2="558" y2="150" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="522" y1="155" x2="558" y2="150" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="522" y1="230" x2="558" y2="150" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
