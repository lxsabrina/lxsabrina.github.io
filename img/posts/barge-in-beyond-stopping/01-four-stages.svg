<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 355" width="680" height="355" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>打断处理的四个环节与对应评测</title><desc>打断处理分为识别、让出话轮、更新状态、恢复续接四步，各自对应不同的公开评测基准。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="355" rx="10" fill="#FFFFFF"/><text x="340" y="24" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">一次打断要依次过四关</text><rect x="20" y="50" width="130" height="80" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="85.0" y="90.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">1 识别</text><line x1="152" y1="90" x2="188" y2="90" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><text x="85" y="160" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">是真打断吗？</text><text x="85" y="180" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">还是附和/噪声</text><line x1="85" y1="132" x2="85" y2="148" stroke="#B4B2A9" stroke-width="1"/><rect x="20" y="205" width="130" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="85.0" y="230.5" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">SID-Bench</text><text x="85.0" y="249.5" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">FIR / IRL / APT</text><rect x="190" y="50" width="130" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="255.0" y="90.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">2 让出话轮</text><line x1="322" y1="90" x2="358" y2="90" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><text x="255" y="160" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">多快停下？</text><text x="255" y="180" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">停得干净吗</text><line x1="255" y1="132" x2="255" y2="148" stroke="#B4B2A9" stroke-width="1"/><rect x="190" y="205" width="130" height="70" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/><text x="255.0" y="230.5" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Full-Duplex-Bench</text><text x="255.0" y="249.5" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">打断、附和、时机</text><rect x="360" y="50" width="130" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="425.0" y="90.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">3 更新状态</text><line x1="492" y1="90" x2="528" y2="90" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><text x="425" y="160" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">意图和工具</text><text x="425" y="180" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">是否同步修改</text><line x1="425" y1="132" x2="425" y2="148" stroke="#B4B2A9" stroke-width="1"/><rect x="360" y="205" width="130" height="70" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/><text x="425.0" y="230.5" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Full-Duplex-Bench-v3</text><text x="425.0" y="249.5" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">自我纠正、提前调用</text><rect x="530" y="50" width="130" height="80" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="595.0" y="90.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">4 恢复续接</text><text x="595" y="160" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">接着说什么？</text><text x="595" y="180" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">从哪一步继续</text><line x1="595" y1="132" x2="595" y2="148" stroke="#B4B2A9" stroke-width="1"/><rect x="530" y="205" width="130" height="70" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/><text x="595.0" y="230.5" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">IHBench / EchoChain</text><text x="595.0" y="249.5" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">恢复质量、状态更新</text><text x="340" y="315" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">前两关测“时机”，后两关测“内容”。</text><text x="340" y="335" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">只测前两关，会漏掉停得很干净却把流程带偏的失败。</text></svg>