<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" width="680" height="312" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>打断后状态更新的三类失败</title><desc>用户在助手说话途中插入新信息后，EchoChain 归纳出惯性不变、打断失忆、目标位移三类失败。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="312" rx="10" fill="#FFFFFF"/><text x="340" y="24" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">EchoChain 的三类失败</text><rect x="20" y="48" width="640" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="63.5" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">用户在助手说话中途插入新信息</text><text x="340.0" y="82.5" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">例如改预算、加约束</text><line x1="122" y1="100" x2="122" y2="128" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="20" y="130" width="204" height="66" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="122.0" y="153.5" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">惯性不变</text><text x="122.0" y="172.5" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">承认打断，但内容没改</text><rect x="20" y="206" width="204" height="56" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/><text x="122.0" y="234.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">答案基本照旧</text><line x1="340" y1="100" x2="340" y2="128" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="238" y="130" width="204" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="153.5" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">打断失忆</text><text x="340.0" y="172.5" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">先改对了</text><rect x="238" y="206" width="204" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="234.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">后续轮次又丢掉</text><line x1="558" y1="100" x2="558" y2="128" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="456" y="130" width="204" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="558.0" y="153.5" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">目标位移</text><text x="558.0" y="172.5" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">只回应打断</text><rect x="456" y="206" width="204" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/><text x="558.0" y="234.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">放弃了原始请求</text><text x="340" y="290" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">分类来自论文，各模型的失败数见正文表格。</text></svg>