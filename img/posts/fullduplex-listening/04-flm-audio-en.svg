<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>FLM-Audio (RoboBrain-Audio): channels, text formats and training stages</title><desc>Compares TDM and native channel layouts, word-level alignment and natural monologue text channels, and the four training stages.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="392" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">1. Channel layout: time-division (TDM) vs. native merge</text><text x="24" y="46" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">TDM</text><rect x="70" y="34" width="52" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="96.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">speak</text><rect x="128" y="34" width="52" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="154.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">listen</text><rect x="186" y="34" width="52" height="26" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="212.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">monologue</text><rect x="244" y="34" width="52" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">speak</text><rect x="302" y="34" width="52" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="328.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">listen</text><rect x="360" y="34" width="52" height="26" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="386.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">monologue</text><text x="430" y="47" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">one modality per step; longer sequence</text><text x="24" y="98" font-size="12" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Native</text><rect x="70" y="76" width="62" height="20" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="101.0" y="86.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">listen</text><rect x="70" y="98" width="62" height="20" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="101.0" y="108.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">speak</text><rect x="70" y="120" width="62" height="20" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="101.0" y="130.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">monolog.</text><rect x="140" y="76" width="62" height="20" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="171.0" y="86.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">listen</text><rect x="140" y="98" width="62" height="20" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="171.0" y="108.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">speak</text><rect x="140" y="120" width="62" height="20" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="171.0" y="130.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">monolog.</text><rect x="210" y="76" width="62" height="20" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="241.0" y="86.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">listen</text><rect x="210" y="98" width="62" height="20" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="241.0" y="108.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">speak</text><rect x="210" y="120" width="62" height="20" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="241.0" y="130.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">monolog.</text><text x="290" y="108" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">three channels stacked into one input per step,</text><text x="290" y="126" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">so context does not grow with channels</text><text x="24" y="168" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">2. Text channel: word-level alignment vs. natural monologue</text><text x="24" y="194" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Word-level</text><rect x="110" y="182" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="130.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c1</text><rect x="156" y="182" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="176.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c2</text><rect x="202" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="222.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">P</text><rect x="248" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="268.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">P</text><rect x="294" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="314.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">EP</text><rect x="340" y="182" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="360.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c3</text><rect x="386" y="182" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="406.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c4</text><rect x="432" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="452.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">P</text><rect x="478" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="498.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">EP</text><text x="24" y="230" font-size="12" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Natural mono.</text><rect x="110" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="130.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c1</text><rect x="156" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="176.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c2</text><rect x="202" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="222.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c3</text><rect x="248" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="268.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c4</text><rect x="294" y="218" width="40" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="314.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">w</text><rect x="340" y="218" width="40" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="360.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">w</text><rect x="386" y="218" width="40" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="406.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">w</text><rect x="432" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="452.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c5</text><rect x="478" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="498.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c6</text><text x="110" y="260" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">c = text token, P/EP = padding, w = wait. Natural monologue needs only sentence-level alignment.</text><text x="24" y="290" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">3. Training: two text formats alternated by stage</text><rect x="24" y="304" width="152" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="100.0" y="320.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Post-training</text><text x="100.0" y="339.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">TTS-style (leads)</text><rect x="184" y="304" width="152" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="260.0" y="320.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Post-training</text><text x="260.0" y="339.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ASR-style (follows)</text><rect x="344" y="304" width="152" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="420.0" y="320.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Fine-tune</text><text x="420.0" y="339.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">ASR-resp.-TTS</text><rect x="504" y="304" width="152" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="580.0" y="320.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Fine-tune</text><text x="580.0" y="339.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">resp.-TTS + free input</text><line x1="176" y1="329" x2="184" y2="329" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="336" y1="329" x2="344" y2="329" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="496" y1="329" x2="504" y2="329" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="340" y="376" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Backbone: ~7B, init. from Qwen-2.5-VL LM, Moshi-style RQ-Transformer; audio 12.5 frames/s, 8 tokens/frame (Mimi).</text></svg>