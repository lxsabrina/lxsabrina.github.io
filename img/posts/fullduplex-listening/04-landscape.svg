<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>2026 年全双工语音模型一览</title><desc>五个系统的核心技术与演示、可得性对照。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="480" rx="10" fill="#FFFFFF"/><text x="340" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">2026 年全双工语音模型一览：核心技术与可体验程度</text><text x="32" y="46" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">系统 / 来源</text><text x="186" y="46" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">核心技术</text><text x="448" y="46" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">演示与可得性</text><rect x="24" y="56" width="632" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="32" y="82" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Diffuplex</text><text x="32" y="106" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">NVIDIA · 2610.17780</text><text x="186" y="72" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">AR 策略管时机</text><text x="186" y="94" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">扩散并行生成内容</text><text x="186" y="116" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">每次前向约 13 个 token</text><text x="448" y="82" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-b