<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>FireRedChat system modules</title><desc>The client exchanges audio over RTC; the turn-taking controller holds pVAD, barge-in and end-of-turn; the interaction module offers cascaded, semi-cascaded and speech-to-speech implementations; the dialogue manager handles history, prompt and tools.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="380" rx="10" fill="#FFFFFF"/><text x="340" y="16" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Full-duplex voice interaction framework</text><rect x="16" y="32" width="118" height="270" rx="10" fill="#E8F0E4" stroke="#7A9A6E" stroke-width="0.8"/><text x="75.0" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central"></text><text x="75" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Client</text><rect x="26" y="70" width="98" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="75.0" y="105.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Record / play</text><rect x="26" y="152" width="98" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="75.0" y="187.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Send / receive</text><rect x="228" y="32" width="142" height="270" rx="10" fill="#E8F0E4" stroke="#7A9A6E" stroke-width="0.8"/><text x="299.0" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central"></text><text x="299" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Turn-taking</text><rect x="240" y="70" width="118" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="299.0" y="98.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">pVAD</text><rect x="240" y="140" width="118" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="299.0" y="168.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Barge-in</text><rect x="240" y="210" width="118" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="299.0" y="238.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">End-of-turn</text><rect x="388" y="32" width="194" height="270" rx="10" fill="#E8F0E4" stroke="#7A9A6E" stroke-width="0.8"/><text x="485.0" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central"></text><text x="485" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Interaction module</text><rect x="398" y="70" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="423.0" y="90.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">ASR</text><rect x="462" y="70" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="487.0" y="90.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">LLM</text><rect x="526" y="70" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="551.0" y="90.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">TTS</text><line x1="448" y1="90" x2="460" y2="90" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="512" y1="90" x2="524" y2="90" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="398" y="128" width="110" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="453.0" y="148.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">AudioLLM</text><rect x="526" y="128" width="50" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="551.0" y="148.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">TTS</text><line x1="508" y1="148" x2="524" y2="148" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="398" y="186" width="178" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="487.0" y="206.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Speech to speech</text><rect x="590" y="32" width="74" height="270" rx="10" fill="#E8F0E4" stroke="#7A9A6E" stroke-width="0.8"/><text x="627" y="48" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Dialogue</text><text x="627" y="62" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">manager</text><rect x="596" y="76" width="62" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="627.0" y="98.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">History</text><rect x="596" y="132" width="62" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="627.0" y="154.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Prompt</text><rect x="596" y="188" width="62" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="627.0" y="210.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Tools</text><rect x="596" y="244" width="62" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="627.0" y="266.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">History</text><path d="M582 150 L588 150" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="584" y="178" font-size="10" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">ext.</text><line x1="126" y1="187" x2="226" y2="187" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="176" y="172" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Audio</text><text x="176" y="204" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">RTC</text><path d="M226 106 L128 106" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="176" y="92" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">transcript</text><path d="M358 168 L386 168" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="340" y="326" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">A turn-taking controller makes a half-duplex pipeline full duplex; the interaction module can be</text><text x="340" y="344" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">cascaded, semi-cascaded or end-to-end; the dialogue manager holds history, prompt and tools.</text><text x="340" y="364" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">Redrawn from Figure 1 of the paper (see the original for module relations).</text></svg>