<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 402" width="680" height="402" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>FLAIR：用户说话的时间里，隐空间推理代替静音填充</title><desc>推理时，用户说话阶段模型把上一步隐状态经词表分布加权平均得到下一步输入，继续循环；时序头判断轮到助手后改为输出文本 token。训练时有一个只在训练中使用的全局专家，用整段对话产生隐空间目标。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="402" rx="10" fill="#FFFFFF"/><text x="24" y="24" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">用户说话（听）</text><rect x="24" y="44" width="128" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="88.0" y="70.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">隐状态</text><rect x="184" y="44" width="152" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="260.0" y="70.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">LLM 输出头 → softmax</text><rect x="368" y="44" width="168" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="452.0" y="70.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">对词表嵌入加权平均</text><rect x="568" y="44" width="88" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="612.0" y="70.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">下一步输入</text><line x1="152" y1="70" x2="182" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="336" y1="70" x2="366" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="536" y1="70" x2="566" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><path d="M612 96 L612 118 L88 118 L88 98" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="184" y="146" width="152" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="260.0" y="172.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">时序头 G</text><text x="360" y="160" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">G = 0：继续隐空间推理</text><text x="360" y="184" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">G = 1：输出文本 token</text><text x="24" y="232" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">助手说话</text><rect x="24" y="248" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="124.0" y="274.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">文本 token → 语音模块</text><line x1="224" y1="274" x2="300" y2="274" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="306" y="274" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">用户打断时回到“听”</text><rect x="24" y="326" width="632" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340.0" y="345.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">全局专家（仅训练）</text><text x="340.0" y="364.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">非对称：看到整段对话，给出目标隐变量 Z</text><path d="M520 326 L520 98" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="530" y="214" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">KL 对齐</text></svg>