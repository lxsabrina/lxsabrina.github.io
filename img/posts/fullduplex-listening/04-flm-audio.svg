<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>FLM-Audio（RoboBrain-Audio）：通道、文本格式与训练阶段</title><desc>对比时分复用与原生合并的通道排布、词级对齐与自然独白的文本通道，以及四个训练阶段。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="392" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">一、通道怎么放：时分复用（TDM）与原生合并</text><text x="24" y="46" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">TDM</text><rect x="70" y="34" width="52" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="96.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">说</text><rect x="128" y="34" width="52" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="154.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">听</text><rect x="186" y="34" width="52" height="26" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="212.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">独白</text><rect x="244" y="34" width="52" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="270.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">说</text><rect x="302" y="34" width="52" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="328.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">听</text><rect x="360" y="34" width="52" height="26" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="386.0" y="47.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">独白</text><text x="430" y="47" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">每步一个模态，序列变长</text><text x="24" y="98" font-size="12" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">原生</text><rect x="70" y="76" width="62" height="20" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="101.0" y="86.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">听</text><rect x="70" y="98" width="62" height="20" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="101.0" y="108.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">说</text><rect x="70" y="120" width="62" height="20" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="101.0" y="130.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">独白</text><rect x="140" y="76" width="62" height="20" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="171.0" y="86.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">听</text><rect x="140" y="98" width="62" height="20" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="171.0" y="108.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">说</text><rect x="140" y="120" width="62" height="20" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="171.0" y="130.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">独白</text><rect x="210" y="76" width="62" height="20" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="241.0" y="86.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">听</text><rect x="210" y="98" width="62" height="20" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="241.0" y="108.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">说</text><rect x="210" y="120" width="62" height="20" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="241.0" y="130.0" font-size="10" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">独白</text><text x="290" y="108" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">同一时间步三通道叠加成一个输入，</text><text x="290" y="126" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">上下文不随通道数增长</text><text x="24" y="168" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">二、文本通道：词级对齐 vs. 自然独白</text><text x="24" y="194" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">词级对齐</text><rect x="110" y="182" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="130.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c1</text><rect x="156" y="182" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="176.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c2</text><rect x="202" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="222.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">P</text><rect x="248" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="268.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">P</text><rect x="294" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="314.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">EP</text><rect x="340" y="182" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="360.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c3</text><rect x="386" y="182" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="406.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c4</text><rect x="432" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="452.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">P</text><rect x="478" y="182" width="40" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="498.0" y="195.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">EP</text><text x="24" y="230" font-size="12" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">自然独白</text><rect x="110" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="130.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c1</text><rect x="156" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="176.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c2</text><rect x="202" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="222.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c3</text><rect x="248" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="268.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c4</text><rect x="294" y="218" width="40" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="314.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">w</text><rect x="340" y="218" width="40" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="360.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">w</text><rect x="386" y="218" width="40" height="26" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="406.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">w</text><rect x="432" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="452.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c5</text><rect x="478" y="218" width="40" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="498.0" y="231.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">c6</text><text x="110" y="260" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">c = 文本 token，P/EP = 填充，w = 等待。自然独白只需句子级对齐，不用逐词对齐。</text><text x="24" y="290" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">三、训练：两种文本格式分阶段交替</text><rect x="24" y="304" width="152" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="100.0" y="320.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">后训练</text><text x="100.0" y="339.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">TTS 式（文本领先）</text><rect x="184" y="304" width="152" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="260.0" y="320.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">后训练</text><text x="260.0" y="339.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ASR 式（文本跟随）</text><rect x="344" y="304" width="152" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="420.0" y="320.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">微调</text><text x="420.0" y="339.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">ASR-回应-TTS</text><rect x="504" y="304" width="152" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="580.0" y="320.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">微调</text><text x="580.0" y="339.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">回应-TTS + 自由输入</text><line x1="176" y1="329" x2="184" y2="329" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="336" y1="329" x2="344" y2="329" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="496" y1="329" x2="504" y2="329" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="340" y="376" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">骨干：约 7B，Qwen-2.5-VL 语言模型初始化，Moshi 式 RQ-Transformer；音频 12.5 帧/秒、每帧 8 token（Mimi）。</text></svg>