<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Why Seeduplex works well: joint judgment and four delivery layers (conceptual)</title><desc>Contrasts per-module single-signal judgment in half-duplex systems with Seeduplex's joint judgment, and lists the four delivery layers the blog describes.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="436" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">Traditional half-duplex: each module judges from a single signal</text><rect x="24" y="32" width="144" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="96.0" y="49.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Standalone VAD</text><text x="96.0" y="68.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">acoustic cues only</text><rect x="176" y="32" width="144" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="248.0" y="49.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Front-end denoise</text><text x="248.0" y="68.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">conventional</text><rect x="328" y="32" width="144" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="400.0" y="49.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Local text semantics</text><text x="400.0" y="68.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">only the snippet</text><rect x="480" y="32" width="176" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="568.0" y="49.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Result</text><text x="568.0" y="68.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">misled; cuts in on pauses</text><line x1="464" y1="58" x2="478" y2="58" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="112" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Seeduplex: one native model judges jointly (as the blog describes)</text><rect x="24" y="126" width="144" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="96.0" y="145.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Hears user-side audio</text><text x="96.0" y="164.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">whole acoustic scene</text><rect x="176" y="126" width="144" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="248.0" y="145.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Joint speech+semantics</text><text x="248.0" y="164.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">speech pretraining</text><rect x="328" y="126" width="144" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="400.0" y="145.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Dialogue context</text><text x="400.0" y="164.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">who talks to whom</text><rect x="480" y="126" width="176" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="568.0" y="145.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">One decision</text><text x="568.0" y="164.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">respond / listen / yield</text><line x1="464" y1="154" x2="478" y2="154" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="212" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">The four layers the blog says it took to ship</text><rect x="24" y="228" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="36" y="247" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Model framework</text><text x="180" y="247" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">native real-time structure; learns joint speech-semantics and pacing</text><rect x="24" y="272" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="36" y="291" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Algorithm and training</text><text x="180" y="291" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">speech pretraining + multi-task post-training (5 abilities)</text><rect x="24" y="316" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="36" y="335" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Inference</text><text x="180" y="335" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">speculative sampling and quantization balance cost and latency</text><rect x="24" y="360" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="36" y="379" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Serving stability</text><text x="180" y="379" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">fixes capture/playback stutter under high load; enables full rollout</text><text x="340" y="418" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">Summarized from the official blog text; not an official architecture figure. Network internals are undisclosed.</text></svg>