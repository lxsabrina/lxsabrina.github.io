<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" width="680" height="324" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>One BayLing-Duplex block: user speech, text channel, assistant speech</title><desc>Each 0.8-second block holds 10 user speech tokens, 5 text-channel tokens and 10 assistant speech tokens. The text channel carries four state tokens for listening, speaking, playing and finished.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="324" rx="10" fill="#FFFFFF"/><text x="340" y="26" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">One block = 0.8 s (speech at 12.5 Hz, 80 ms per token)</text><rect x="24" y="50" width="248.8" height="74" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="148.4" y="78.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">User speech</text><text x="148.4" y="97.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">N = 10 tokens</text><rect x="276.8" y="50" width="122.4" height="74" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="338.0" y="78.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Text channel</text><text x="338.0" y="97.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">M = 5 tokens</text><rect x="403.20000000000005" y="50" width="252.8" height="74" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="529.6" y="78.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Assistant speech</text><text x="529.6" y="97.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">N = 10 tokens</text><text x="340" y="140" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">The text channel is an inner monologue and is never spoken.</text><text x="340" y="158" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Assistant text and speech run one block ahead of the user channel.</text><text x="340" y="190" font-size="13" fill="#534AB7" font-weight="500" text-anchor="middle" dominant-baseline="central">Four state tokens in the text channel</text><rect x="24" y="206" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="99.0" y="229.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">[SILENCE]</text><text x="99.0" y="248.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">user talking, stay quiet</text><rect x="184" y="206" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="259.0" y="229.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">[ASSISTANT]</text><text x="259.0" y="248.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">start responding</text><rect x="345" y="206" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="420.0" y="229.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">[PAD]</text><text x="420.0" y="248.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">text done, audio playing</text><rect x="506" y="206" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="581.0" y="229.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">[EPAD]</text><text x="581.0" y="248.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">text and audio finished</text><text x="340" y="300" font-size="12" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">Every listen / speak / stop decision is next-token prediction: no classifier or state machine.</text></svg>