<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" width="680" height="324" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Diffuplex architecture: AR policy + diffusion canvas</title><desc>The AR policy reads encoded speech and emits states; on bos, speech and text instructions are concatenated and prefilled into the diffusion LM, which iteratively denoises a 256-token canvas; the first 8 committed tokens go to streaming TTS.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="324" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">Step 1: AR interaction policy (same backbone)</text><rect x="24" y="30" width="120" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="84.0" y="44.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">User speech</text><text x="84.0" y="63.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">80 ms</text><rect x="168" y="30" width="150" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="243.0" y="44.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Speech encoder</text><text x="243.0" y="63.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Parakeet</text><rect x="342" y="30" width="190" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="437.0" y="44.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">AR policy</text><text x="437.0" y="63.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">listen / speak / bos / eos</text><line x1="144" y1="53" x2="166" y2="53" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="318" y1="53" x2="340" y2="53" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="556" y="53" font-size="12" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">bos fires</text><line x1="532" y1="53" x2="552" y2="53" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="108" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Step 2: the diffusion LM (DLM) denoises a canvas in parallel</text><rect x="24" y="122" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="89.0" y="135.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Concat</text><text x="89.0" y="154.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">speech + text instr.</text><rect x="200" y="118" width="120" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="260.0" y="135.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">DLM</text><text x="260.0" y="154.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">prefill &lt;bos&gt;</text><line x1="154" y1="144" x2="198" y2="144" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="364" y="118" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="449.0" y="135.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Canvas n (256 tokens)</text><text x="449.0" y="154.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">bidirectional</text><path d="M320 136 L362 136" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><path d="M449 172 L449 198 L260 198 L260 172" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="354" y="212" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">logits → next denoising step (canvas n+1)</text><rect x="560" y="118" width="96" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="608.0" y="135.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Streaming TTS</text><text x="608.0" y="154.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">CosyVoice 3</text><path d="M534 144 L558 144" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="608" y="184" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">anchored prefix</text><text x="608" y="200" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">first 8 tokens</text><rect x="24" y="236" width="632" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340.0" y="259.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">User barges in within 1 s: unspoken canvas is discarded; back to the AR policy</text><text x="340" y="306" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Shared parameters, separate KV caches. "When to speak" lives on the AR timeline; "what to say" is free of the audio frame rate.</text></svg>