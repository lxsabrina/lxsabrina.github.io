<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" width="680" height="326" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Diffuplex: AR policy plus parallel diffusion</title><desc>The AR policy predicts listen/speak states per 80 ms chunk; on bos the diffusion mode generates a 256-token canvas in parallel and streams the first 8 committed tokens to TTS.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="326" rx="10" fill="#FFFFFF"/><text x="24" y="22" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">Always-on autoregressive policy (AR)</text><rect x="24" y="38" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="99.0" y="55.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">User audio</text><text x="99.0" y="74.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">80 ms chunks</text><rect x="206" y="38" width="170" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="291.0" y="55.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">AR interaction policy</text><text x="291.0" y="74.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">listen / speak / bos / eos</text><line x1="174" y1="64" x2="204" y2="64" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="408" y="38" width="248" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="532.0" y="55.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Trigger: &lt;bos&gt;</text><text x="532.0" y="74.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">speech context prefilled into diffusion cache</text><line x1="376" y1="64" x2="406" y2="64" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="656" y="124" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="end" dominant-baseline="central">Parallel diffusion generation (shared backbone, separate KV cache)</text><rect x="24" y="142" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="124.0" y="163.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">256-token canvas</text><text x="124.0" y="182.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">bidirectional denoising</text><rect x="256" y="142" width="190" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="351.0" y="163.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Anchored prefix: first 8 tokens</text><text x="351.0" y="182.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">committed within K passes</text><rect x="478" y="142" width="178" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="567.0" y="163.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Streaming TTS</text><text x="567.0" y="182.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">CosyVoice 3</text><line x1="224" y1="172" x2="254" y2="172" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="446" y1="172" x2="476" y2="172" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><path d="M532 90 L532 108 L124 108 L124 140" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="24" y="232" width="632" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340.0" y="256.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">User barges in within 1 s: unspoken canvas is discarded</text><text x="340" y="306" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">"When to speak" lives on the AR timeline; "what to say" is generated in parallel, off the audio frame rate.</text></svg>