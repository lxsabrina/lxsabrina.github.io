<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 274" width="680" height="274" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Dessa page demos: six conversation recordings</title><desc>The six live conversation recordings shown on the page.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="274" rx="10" fill="#FFFFFF"/><rect x="24" y="16" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="40,36 40,56 56,46" fill="#993C1D"/><text x="68" y="36" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">About the release</text><text x="68" y="58" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">laughs mid-sentence; gets louder when asked</text><rect x="348" y="16" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="364,36 364,56 380,46" fill="#993C1D"/><text x="392" y="36" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Remembering a movie</text><text x="392" y="58" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">user blanks on the title; Dessa finishes it</text><rect x="24" y="86" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="40,106 40,126 56,116" fill="#993C1D"/><text x="68" y="106" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">An anniversary surprise</text><text x="68" y="128" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">gasps, then answers with teary-sounding thanks</text><rect x="348" y="86" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="364,106 364,126 380,116" fill="#993C1D"/><text x="392" y="106" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Expressive conversation</text><text x="392" y="128" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">wide range in intonation and speed</text><rect x="24" y="156" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="40,176 40,196 56,186" fill="#993C1D"/><text x="68" y="176" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Life advice</text><text x="68" y="198" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">sounds empathetic</text><rect x="348" y="156" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="364,176 364,196 380,186" fill="#993C1D"/><text x="392" y="176" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">With GPT-Live-1</text><text x="392" y="198" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">talks to a third-party model; both voices are AI</text><text x="340" y="238" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Each clip is a live recording of a person talking to Dessa, unsteered, with subtitles added afterward; two synchronized tracks.</text><text x="340" y="258" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">The page has no UI, only these recordings; this summarizes the page text and is not a screenshot.</text></svg>