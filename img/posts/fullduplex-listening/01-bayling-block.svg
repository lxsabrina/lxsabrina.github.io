<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" width="680" height="324" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>BayLing-Duplex 的一个块：用户语音、文本通道、助手语音</title><desc>每个块依次包含 10 个用户语音 token、5 个文本通道 token 和 10 个助手语音 token，共 0.8 秒。文本通道使用四个状态 token 表达听、说、播放中、说完。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="324" rx="10" fill="#FFFFFF"/><text x="340" y="26" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">一个块 = 0.8 秒（语音 12.5 Hz，每 token 80 ms）</text><rect x="24" y="50" width="248.8" height="74" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="148.4" y="78.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">用户语音</text><text x="148.4" y="97.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">N = 10 个 token</text><rect x="276.8" y="50" width="122.4" height="74" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="338.0" y="78.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">文本通道</text><text x="338.0" y="97.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">M = 5 个 token</text><rect x="403.20000000000005" y="50" width="252.8" height="74" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="529.6" y="78.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">助手语音</text><text x="529.6" y="97.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">N = 10 个 token</text><text x="340" y="140" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">文本通道是内心独白，不会被说出。</text><text x="340" y="158" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">助手侧文本与语音相对用户通道前移一个块。</text><text x="340" y="190" font-size="13" fill="#534AB7" font-weight="500" text-anchor="middle" dominant-baseline="central">文本通道里的四个状态 token</text><rect x="24" y="206" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="99.0" y="229.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">[SILENCE]</text><text x="99.0" y="248.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">用户在说，助手不说</text><rect x="184" y="206" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="259.0" y="229.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">[ASSISTANT]</text><text x="259.0" y="248.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">助手开始回应</text><rect x="345" y="206" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="420.0" y="229.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">[PAD]</text><text x="420.0" y="248.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">文字已写完，语音还在播</text><rect x="506" y="206" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="581.0" y="229.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">[EPAD]</text><text x="581.0" y="248.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">文字和语音都结束</text><text x="340" y="300" font-size="12" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">所有“听 / 说 / 停”的决定都是下一个 token 预测，没有分类器或状态机。</text></svg>