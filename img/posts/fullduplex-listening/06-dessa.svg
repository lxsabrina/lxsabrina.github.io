<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="680" height="318" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Dessa：语音到语音，不经过文本（概念图）</title><desc>单一模型直接从人类语音输入产生语音输出，官网声明没有语音转文字、文本数据和预训练语言模型。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="318" rx="10" fill="#FFFFFF"/><rect x="24" y="40" width="120" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="84.0" y="61.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">人类语音</text><text x="84.0" y="80.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">输入</text><rect x="184" y="28" width="290" height="84" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="329.0" y="61.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Dessa（单一语音到语音模型）</text><text x="329.0" y="80.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">全双工：边听边说，自选插话与附和</text><rect x="516" y="40" width="140" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="586.0" y="61.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">语音</text><text x="586.0" y="80.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">输出</text><line x1="144" y1="70" x2="182" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="474" y1="70" x2="514" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="142" font-size="13" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">官网说明没有用到的部分</text><rect x="24" y="158" width="200" height="40" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/><text x="124" y="178" font-size="13" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">语音转文字</text><line x1="44" y1="198" x2="204" y2="158" stroke="#993C1D" stroke-width="1.2"/><rect x="236" y="158" width="200" height="40" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/><text x="336" y="178" font-size="13" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">文本数据</text><line x1="256" y1="198" x2="416" y2="158" stroke="#993C1D" stroke-width="1.2"/><rect x="448" y="158" width="200" height="40" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/><text x="548" y="178" font-size="13" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">预训练语言模型</text><line x1="468" y1="198" x2="628" y2="158" stroke="#993C1D" stroke-width="1.2"/><text x="24" y="232" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">训练：只用人类对话录音，从零开始</text><text x="24" y="252" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">运行：快于实时，可在 M4 Max 或更高配置的 MacBook Pro 上本地运行</text><text x="340" y="282" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">官网没有给出参数量、数据来源、内部结构或基准。</text><text x="340" y="300" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">此图只画官网文字描述的信息流，不是官方架构图。</text></svg>