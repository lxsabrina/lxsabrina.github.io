<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 374" width="680" height="374" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>BayLing-Duplex 架构：块交错序列</title><desc>语音 tokenizer 把双路音频变成 token，按块交错排布后由单个 LLM 自回归预测文本和助手语音 token，再由语音解码器合成。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="374" rx="10" fill="#FFFFFF"/><rect x="24" y="16" width="632" height="38" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="35.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">语音解码器（流匹配 + HiFi-GAN）</text><rect x="24" y="76" width="632" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="101.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">LLM：9B decoder-only（GLM-4-Voice 初始化，全参数微调）</text><text x="340" y="148" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">每个块 0.8 秒：N=10 个用户语音 token + M=5 个文本 token + N=10 个助手语音 token</text><rect x="24" y="164" width="200" height="48" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/><circle cx="46" cy="188" r="9" fill="#CDEBDD" stroke="#0F6E56" stroke-width="0.8"/><circle cx="72" cy="188" r="9" fill="#CDEBDD" stroke="#0F6E56" stroke-width="0.8"/><text x="124" y="188" font-size="13" fill="#2C2C2A" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle" dominant-baseline="central">[S] [S]</text><circle cx="176" cy="188" r="9" fill="#FAD9CC" stroke="#993C1D" stroke-width="0.8"/><circle cx="202" cy="188" r="9" fill="#FAD9CC" stroke="#993C1D" stroke-width="0.8"/><text x="124" y="226" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">用户在说，助手不说</text><rect x="240" y="164" width="200" height="48" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/><circle cx="262" cy="188" r="9" fill="#CDEBDD" stroke="#0F6E56" stroke-width="0.8"/><circle cx="288" cy="188" r="9" fill="#CDEBDD" stroke="#0F6E56" stroke-width="0.8"/><text x="340" y="188" font-size="13" fill="#2C2C2A" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle" dominant-baseline="central">[A] The</text><circle cx="392" cy="188" r="9" fill="#FAD9CC" stroke="#993C1D" stroke-width="0.8"/><circle cx="418" cy="188" r="9" fill="#FAD9CC" stroke="#993C1D" stroke-width="0.8"/><text x="340" y="226" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">助手开始回应</text><rect x="456" y="164" width="200" height="48" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/><circle cx="478" cy="188" r="9" fill="#CDEBDD" stroke="#0F6E56" stroke-width="0.8"/><circle cx="504" cy="188" r="9" fill="#CDEBDD" stroke="#0F6E56" stroke-width="0.8"/><text x="556" y="188" font-size="13" fill="#2C2C2A" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle" dominant-baseline="central">time is</text><circle cx="608" cy="188" r="9" fill="#FAD9CC" stroke="#993C1D" stroke-width="0.8"/><circle cx="634" cy="188" r="9" fill="#FAD9CC" stroke="#993C1D" stroke-width="0.8"/><text x="556" y="226" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">继续说</text><rect x="24" y="248" width="632" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="267.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">语音 tokenizer（改自 Whisper-large-v3 编码器 + VQ，12.5 Hz，每 token 80 ms）</text><line x1="80" y1="246" x2="80" y2="216" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="80" y1="162" x2="80" y2="128" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="80" y1="74" x2="80" y2="56" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="100" y="312" font-size="12" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">输入：用户语音（两路等长音频：用户、助手）</text><text x="100" y="332" font-size="12" fill="#534AB7" font-weight="400" text-anchor="start" dominant-baseline="central">输出：助手语音；文本通道是不播出的“内心独白”，含四个状态 token</text><text x="340" y="358" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">[S]=SILENCE  [A]=ASSISTANT  [P]=PAD（文字已写，语音还在播）  [E]=EPAD（都结束）</text></svg>