<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 274" width="680" height="274" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Dessa 官网演示：六段对话录音</title><desc>官网展示的六段实时对话录音。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="274" rx="10" fill="#FFFFFF"/><rect x="24" y="16" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="40,36 40,56 56,46" fill="#993C1D"/><text x="68" y="36" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">谈论发布</text><text x="68" y="58" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">笑点一到就在句中笑；被要求大声点就提高音量</text><rect x="348" y="16" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="364,36 364,56 380,46" fill="#993C1D"/><text x="392" y="36" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">回忆电影</text><text x="392" y="58" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">用户忘了片名，Dessa 接着把句子说完</text><rect x="24" y="86" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="40,106 40,126 56,116" fill="#993C1D"/><text x="68" y="106" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">周年惊喜</text><text x="68" y="128" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">小声惊呼，然后带着像含泪的感激回答</text><rect x="348" y="86" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="364,106 364,126 380,116" fill="#993C1D"/><text x="392" y="106" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">富有表现力的对话</text><text x="392" y="128" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">语调和语速变化很大</text><rect x="24" y="156" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="40,176 40,196 56,186" fill="#993C1D"/><text x="68" y="176" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">人生建议</text><text x="68" y="198" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">听起来有同理心</text><rect x="348" y="156" width="308" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><polygon points="364,176 364,196 380,186" fill="#993C1D"/><text x="392" y="176" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">与 GPT-Live-1 对话</text><text x="392" y="198" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">与第三方模型互相交谈，双方都是 AI 声音</text><text x="340" y="238" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">每段都是真人与 Dessa 的实时对话录音，无人引导，字幕为事后添加；双声道同步播放。</text><text x="340" y="258" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">官网没有 UI，只有这些录音；此图按页面文字整理，不是截图。</text></svg>