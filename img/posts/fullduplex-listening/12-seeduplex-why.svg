<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Seeduplex 为什么做得好：联合判断与落地四层（概念图）</title><desc>对比传统半双工各模块凭单一信号判断与 Seeduplex 的联合判断，并列出官方描述的落地四层。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="436" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">传统半双工：每个模块凭单一信号各自判断</text><rect x="24" y="32" width="144" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="96.0" y="49.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">独立 VAD</text><text x="96.0" y="68.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">只看声学特征，机械切音</text><rect x="176" y="32" width="144" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="248.0" y="49.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">前端降噪</text><text x="248.0" y="68.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">传统算法</text><rect x="328" y="32" width="144" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="400.0" y="49.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">局部文本语义</text><text x="400.0" y="68.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">只看已转写的片段</text><rect x="480" y="32" width="176" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="568.0" y="49.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">结果</text><text x="568.0" y="68.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">易被带跑偏；停顿时抢话</text><line x1="464" y1="58" x2="478" y2="58" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="112" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Seeduplex：一个原生模型联合判断（官方描述）</text><rect x="24" y="126" width="144" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="96.0" y="145.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">持续听用户侧音频</text><text x="96.0" y="164.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">感知全局声学环境</text><rect x="176" y="126" width="144" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="248.0" y="145.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">语音语义联合建模</text><text x="248.0" y="164.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">大规模语音预训练</text><rect x="328" y="126" width="144" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="400.0" y="145.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">对话上下文</text><text x="400.0" y="164.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">谁在对谁说、说没说完</text><rect x="480" y="126" width="176" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="568.0" y="145.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">一次决定</text><text x="568.0" y="164.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">回应 / 继续听 / 让出话轮</text><line x1="464" y1="154" x2="478" y2="154" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="212" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">官方说的落地四层</text><rect x="24" y="228" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="36" y="247" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">模型框架</text><text x="180" y="247" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">贴合实时对话的原生结构，直接从数据学语音语义一体表示与节奏控制</text><rect x="24" y="272" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="36" y="291" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">算法与训练</text><text x="180" y="291" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">海量语音预训练 + 多任务后训练：对话智能、低延迟、节奏控制、抗干扰、指向性理解</text><rect x="24" y="316" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="36" y="335" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">推理性能</text><text x="180" y="335" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">投机采样、量化，平衡成本与延迟</text><rect x="24" y="360" width="632" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="36" y="379" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">服务稳定性</text><text x="180" y="379" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">解决高并发下的收音、播报卡顿，支撑全量上线</text><text x="340" y="418" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">依据官方博客文字整理，不是官方架构图；官方未公开具体网络结构。</text></svg>