<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="680" height="318" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Dessa: speech to speech, no text in between (conceptual)</title><desc>One model maps human speech to speech; the page states no speech-to-text, text data or pretrained language model.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="318" rx="10" fill="#FFFFFF"/><rect x="24" y="40" width="120" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="84.0" y="61.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Human speech</text><text x="84.0" y="80.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">input</text><rect x="184" y="28" width="290" height="84" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="329.0" y="61.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Dessa (one speech-to-speech model)</text><text x="329.0" y="80.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">full duplex; picks when to cut in / backchannel</text><rect x="516" y="40" width="140" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="586.0" y="61.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Speech</text><text x="586.0" y="80.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">output</text><line x1="144" y1="70" x2="182" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="474" y1="70" x2="514" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="142" font-size="13" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">Parts the page says are not used</text><rect x="24" y="158" width="200" height="40" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/><text x="124" y="178" font-size="13" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">speech-to-text</text><line x1="44" y1="198" x2="204" y2="158" stroke="#993C1D" stroke-width="1.2"/><rect x="236" y="158" width="200" height="40" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/><text x="336" y="178" font-size="13" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">text data</text><line x1="256" y1="198" x2="416" y2="158" stroke="#993C1D" stroke-width="1.2"/><rect x="448" y="158" width="200" height="40" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/><text x="548" y="178" font-size="13" fill="#888780" font-weight="400" text-anchor="middle" dominant-baseline="central">pretrained language model</text><line x1="468" y1="198" x2="628" y2="158" stroke="#993C1D" stroke-width="1.2"/><text x="24" y="232" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Training: from scratch, on recorded human conversation only</text><text x="24" y="252" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Runtime: faster than real time; runs locally on an M4 Max MacBook Pro or better</text><text x="340" y="282" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">The page gives no parameter count, data, internals or benchmarks.</text><text x="340" y="300" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">This shows only the data flow in the page text; it is not an official architecture figure.</text></svg>