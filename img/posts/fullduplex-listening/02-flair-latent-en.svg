<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 402" width="680" height="402" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>FLAIR: latent reasoning replaces idle padding while the user speaks</title><desc>At inference, while the user speaks the model turns the previous hidden state into a softmax-weighted average of vocabulary embeddings and feeds it back; a timing head decides when to switch to emitting text tokens. A global expert used only in training provides latent targets from the whole dialogue.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="402" rx="10" fill="#FFFFFF"/><text x="24" y="24" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">User speaking (listen)</text><rect x="24" y="44" width="128" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="88.0" y="70.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">hidden state</text><rect x="184" y="44" width="152" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="260.0" y="70.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">LM head → softmax</text><rect x="368" y="44" width="168" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="452.0" y="70.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">avg. of embeddings</text><rect x="568" y="44" width="88" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="612.0" y="70.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">next input</text><line x1="152" y1="70" x2="182" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="336" y1="70" x2="366" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="536" y1="70" x2="566" y2="70" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><path d="M612 96 L612 118 L88 118 L88 98" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="184" y="146" width="152" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="260.0" y="172.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Timing head G</text><text x="360" y="160" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">G = 0: keep reasoning</text><text x="360" y="184" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">G = 1: emit text token</text><text x="24" y="232" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Assistant speaking</text><rect x="24" y="248" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="124.0" y="274.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">text tokens → speech module</text><line x1="224" y1="274" x2="300" y2="274" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="306" y="274" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">user barge-in: back to listening</text><rect x="24" y="326" width="632" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340.0" y="345.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Global expert (training only)</text><text x="340.0" y="364.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">Non-causal: sees the full dialogue, gives target latent Z</text><path d="M520 326 L520 98" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="530" y="214" font-size="12" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">KL align</text></svg>