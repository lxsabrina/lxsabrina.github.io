<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Seeduplex: from a half-duplex pipeline to native full duplex (conceptual)</title><desc>A native model replaces standalone VAD and denoising and decides to respond, keep listening or yield.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="400" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">Before: half-duplex pipeline (as the blog describes it)</text><rect x="24" y="32" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="84.0" y="57.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Mic</text><rect x="172" y="32" width="190" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="267.0" y="57.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Standalone VAD + denoise</text><rect x="390" y="32" width="266" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="523.0" y="57.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Half-duplex end-to-end speech model</text><line x1="144" y1="57" x2="170" y2="57" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="362" y1="57" x2="388" y2="57" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="116" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Seeduplex: one native full-duplex model</text><rect x="24" y="130" width="120" height="86" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="84.0" y="164.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Continuous audio</text><text x="84.0" y="183.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">listen + speak</text><rect x="172" y="130" width="260" height="86" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="302.0" y="164.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Native full-duplex model</text><text x="302.0" y="183.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">in-house LLM; acoustic cues + dialogue context</text><line x1="144" y1="173" x2="170" y2="173" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="460" y="130" width="196" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="558.0" y="143.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">start responding</text><line x1="432" y1="173" x2="458" y2="143" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="460" y="160" width="196" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="558.0" y="173.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">keep listening</text><line x1="432" y1="173" x2="458" y2="173" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="460" y="190" width="196" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="558.0" y="203.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">yield to interruption</text><line x1="432" y1="173" x2="458" y2="203" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="248" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">Two capabilities the blog stresses</text><rect x="24" y="262" width="316" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="182.0" y="278.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Interference robustness</text><text x="182.0" y="297.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">main speaker vs. noise and bystanders</text><rect x="354" y="262" width="302" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="505.0" y="278.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Dynamic end-of-turn</text><text x="505.0" y="297.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">speech + semantics: wait out pauses, answer fast</text><text x="24" y="340" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Training: large-scale speech pretraining + multi-task post-training (dialogue, latency, turn-taking, robustness, directed speech)</text><text x="24" y="358" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Inference: speculative sampling + quantization.</text><text x="340" y="384" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">Model size, data and internals are not disclosed; this shows only the division of work the blog describes, not an official architecture figure.</text></svg>