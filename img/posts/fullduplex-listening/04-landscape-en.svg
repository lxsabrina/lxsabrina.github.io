<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Full-duplex speech models at a glance</title><desc>Core idea and demo/availability for five systems.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="480" rx="10" fill="#FFFFFF"/><text x="340" y="22" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Full-duplex speech models at a glance: core idea and how to try them</text><text x="32" y="46" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">System</text><text x="186" y="46" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">Core idea</text><text x="448" y="46" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">Demo / availability</text><rect x="24" y="56" width="632" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="32" y="82" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Diffuplex</text><text x="32" y="106" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">NVIDIA · 2610.17780</text><text x="186" y="72" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">AR policy decides timing;</text><text x="186" y="94" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">diffusion generates content</text><text x="186" y="116" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">~13 tokens per forward pass</text><text x="448" y="82" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">No public demo</text><text x="448" y="104" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">code and weights "soon"</text><rect x="24" y="140" width="632" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="32" y="166" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Seeduplex</text><text x="32" y="190" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">ByteDance · Apr 2026</text><text x="186" y="156" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Native full duplex, robust to</text><text x="186" y="178" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">interference; joint speech +</text><text x="186" y="200" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">semantic end-of-turn (no details)</text><text x="448" y="166" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Try in Doubao app (call mode)</text><text x="448" y="188" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">demo videos on project page</text><rect x="24" y="224" width="632" height="76" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="32" y="250" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Dessa</text><text x="32" y="274" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Block · Oct 2026</text><text x="186" y="240" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Trained from scratch on human</text><text x="186" y="262" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">conversation only; no text, no</text><text x="186" y="284" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">pretrained LLM; runs on a MacBook</text><text x="448" y="250" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Recorded conversations on page</text><text x="448" y="272" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">waitlist, safety researchers</text><rect x="24" y="308" width="632" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="32" y="334" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">RoboBrain-Audio</text><text x="32" y="358" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">BAAI · 2509.02521</text><text x="186" y="324" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">7B; text channel of whole</text><text x="186" y="346" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">sentences plus "wait" tokens;</text><text x="186" y="368" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">text-leads / text-follows training</text><text x="448" y="334" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Paper: code/models to come</text><text x="448" y="356" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">press: open-sourced</text><rect x="24" y="392" width="632" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="32" y="418" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">FireRedChat</text><text x="32" y="442" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Xiaohongshu · Sep 2025</text><text x="186" y="408" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Not native: pVAD + semantic</text><text x="186" y="430" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">end-of-turn make a pipeline</text><text x="186" y="452" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">full duplex; (semi-)cascaded</text><text x="448" y="418" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">Demo page with samples</text><text x="448" y="440" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">no code link on paper page</text></svg>