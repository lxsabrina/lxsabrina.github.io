<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>FLAIR architecture: streaming SDLM and latent reasoning while listening</title><desc>Left: the streaming pipeline of speech encoder, LLM, text projector, speech generation and synthesizer. Right: the text channel takes latent embeddings while listening and emits text tokens while speaking; a global expert supplies targets in training.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="348" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">SDLM</text><rect x="24" y="34" width="214" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="131.0" y="54.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Streaming speech encoder</text><rect x="24" y="92" width="214" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="131.0" y="112.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Decoder-only LLM</text><rect x="24" y="150" width="214" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="131.0" y="170.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Text projector</text><rect x="24" y="208" width="214" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="131.0" y="228.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Speech generation (AR)</text><rect x="24" y="266" width="214" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="131.0" y="286.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Streaming speech synthesizer</text><line x1="131" y1="74" x2="131" y2="92" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="131" y1="132" x2="131" y2="150" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="131" y1="190" x2="131" y2="208" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="131" y1="248" x2="131" y2="266" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="131" y="330" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">user audio in, assistant audio out</text><text x="280" y="18" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Text channel: what the same LLM is fed while listening vs. speaking</text><text x="280" y="46" font-size="12" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">User speaking (listen)</text><rect x="280" y="56" width="48" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="304.0" y="73.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">h1</text><rect x="336" y="56" width="48" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="360.0" y="73.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">h2</text><rect x="392" y="56" width="48" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="416.0" y="73.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">h3</text><rect x="448" y="56" width="48" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="472.0" y="73.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">h4</text><text x="512" y="73" font-size="14" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">…</text><path d="M300 94 L300 114 L508 114 L508 92" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="280" y="132" font-size="11" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">prev. hidden state → LM head + softmax →</text><text x="280" y="148" font-size="11" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">weighted vocab embeddings → next input</text><text x="280" y="172" font-size="12" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Assistant turn (G=1)</text><rect x="280" y="182" width="56" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="308.0" y="199.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">&lt;bos&gt;</text><rect x="344" y="182" width="56" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="372.0" y="199.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">T1</text><rect x="408" y="182" width="56" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="436.0" y="199.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">T2</text><rect x="472" y="182" width="56" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="500.0" y="199.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">&lt;PAD&gt;</text><rect x="536" y="182" width="56" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="564.0" y="199.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">&lt;eos&gt;</text><text x="280" y="232" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Emits text tokens; timing head G decides when to switch;</text><text x="280" y="248" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">barge-in returns to latent reasoning</text><rect x="280" y="266" width="376" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="468.0" y="289.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Global expert (training only)</text><text x="468.0" y="308.0" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">non-causal; sees the full dialogue; target latent Z via KL; dropped at inference</text></svg>