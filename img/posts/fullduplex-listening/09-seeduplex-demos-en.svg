<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 374" width="680" height="374" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Seeduplex official demos: ten scenarios</title><desc>The blog groups its demos into five interference scenarios and five end-of-turn scenarios.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="374" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Interference robustness: who is talking to me</text><rect x="24" y="34" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="50" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">In the car</text><text x="34" y="72" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">announcements and navigation mixed in; follows the main user</text><rect x="24" y="96" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="112" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Cafe</text><text x="34" y="134" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">a passing friend says goodbye; not treated as a command</text><rect x="24" y="158" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="174" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">At home</text><text x="34" y="196" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">user answers a courier at the door; no cut-in</text><rect x="24" y="220" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="236" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Group</text><text x="34" y="258" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">tells commands from side chat</text><rect x="24" y="282" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="298" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Ambient</text><text x="34" y="320" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">background talks about Hangzhou; user mentions a trip; reply links both</text><text x="348" y="18" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Dynamic end-of-turn: when to speak</text><rect x="348" y="34" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="50" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Thinking aloud</text><text x="358" y="72" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">repeated revisions; no cut-in</text><rect x="348" y="96" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="112" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">English interview</text><text x="358" y="134" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">a stall is a pause, not the end</text><rect x="348" y="158" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="174" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Rapid Q&amp;A</text><text x="358" y="196" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">answers right after the last word; ~250 ms faster</text><rect x="348" y="220" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="236" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Poetry game</text><text x="358" y="258" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">seamless back-and-forth</text><rect x="348" y="282" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="298" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">Interrupted</text><text x="358" y="320" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">user: "hold on, let me grab a pen"; stops and listens</text><text x="340" y="358" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">The blog has 10 demo videos; this summarizes its text descriptions and is not a screenshot.</text></svg>