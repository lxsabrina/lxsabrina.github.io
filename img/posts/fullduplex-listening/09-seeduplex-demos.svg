<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 374" width="680" height="374" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Seeduplex 官方演示：十个场景</title><desc>官方博客的演示分两组：五个抗干扰场景和五个动态判停场景。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="374" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">抗干扰：谁在对我说话</text><rect x="24" y="34" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="50" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">车内</text><text x="34" y="72" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">播报与导航声混杂，只认主用户</text><rect x="24" y="96" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="112" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">咖啡厅</text><text x="34" y="134" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">路过的朋友道别，不当作指令</text><rect x="24" y="158" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="174" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">居家</text><text x="34" y="196" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">随口答复门外外卖员，不抢答</text><rect x="24" y="220" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="236" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">多人对话</text><text x="34" y="258" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">分辨指令与他人闲聊</text><rect x="24" y="282" width="308" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="298" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">环境音</text><text x="34" y="320" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">背景介绍杭州，用户说想去，模型联动回应</text><text x="348" y="18" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">动态判停：什么时候该说</text><rect x="348" y="34" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="50" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">边想边改</text><text x="358" y="72" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">反复修正甚至推翻前文，不抢话</text><rect x="348" y="96" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="112" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">英文面试</text><text x="358" y="134" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">卡壳当作留白，等说完再反馈</text><rect x="348" y="158" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="174" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">快问快答</text><text x="358" y="196" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">话音一落即答，判停延迟约降 250 ms</text><rect x="348" y="220" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="236" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">飞花令</text><text x="358" y="258" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">对答如流，无缝衔接</text><rect x="348" y="282" width="308" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="358" y="298" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">被打断</text><text x="358" y="320" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">用户说“等一下，我拿笔记”，立即收声转入聆听</text><text x="340" y="358" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">官方博客共 10 个演示视频，此图按博客文字描述整理，不是视频截图。</text></svg>