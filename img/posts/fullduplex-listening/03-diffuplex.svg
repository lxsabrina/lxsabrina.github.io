<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" width="680" height="324" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Diffuplex 架构：AR 策略 + 扩散画布</title><desc>AR 策略读取语音编码并输出状态，触发 bos 后语音与文本指令拼接预填进扩散语言模型，扩散模型在 256 token 画布上迭代去噪，前 8 个 token 提交后送入流式 TTS。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="324" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">第一步：自回归交互策略（同一骨干）</text><rect x="24" y="30" width="120" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="84.0" y="44.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">用户语音</text><text x="84.0" y="63.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">80 ms</text><rect x="168" y="30" width="150" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="243.0" y="44.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">语音编码器</text><text x="243.0" y="63.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Parakeet</text><rect x="342" y="30" width="190" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="437.0" y="44.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">AR 策略</text><text x="437.0" y="63.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">listen / speak / bos / eos</text><line x1="144" y1="53" x2="166" y2="53" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="318" y1="53" x2="340" y2="53" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="556" y="53" font-size="12" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">bos 触发</text><line x1="532" y1="53" x2="552" y2="53" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="108" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">第二步：扩散语言模型（DLM）在画布上并行去噪</text><rect x="24" y="122" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="89.0" y="135.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">拼接</text><text x="89.0" y="154.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">语音 + 文本指令</text><rect x="200" y="118" width="120" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="260.0" y="135.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">DLM</text><text x="260.0" y="154.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">预填 &lt;bos&gt;</text><line x1="154" y1="144" x2="198" y2="144" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="364" y="118" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="449.0" y="135.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">画布 n（256 token）</text><text x="449.0" y="154.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">双向去噪</text><path d="M320 136 L362 136" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><path d="M449 172 L449 198 L260 198 L260 172" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="354" y="212" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">logits → 下一轮去噪（画布 n+1）</text><rect x="560" y="118" width="96" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="608.0" y="135.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">流式 TTS</text><text x="608.0" y="154.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">CosyVoice 3</text><path d="M534 144 L558 144" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="608" y="184" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">锚定前缀</text><text x="608" y="200" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="middle" dominant-baseline="central">前 8 个 token</text><rect x="24" y="236" width="632" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340.0" y="259.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">用户 1 秒内打断：丢弃尚未播出的画布，回到 AR 策略继续听</text><text x="340" y="306" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">两种模式共享参数，各有独立 KV 缓存；“何时说”在 AR 时间线，“说什么”不再受音频帧率限制。</text></svg>