<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Seeduplex：从半双工管线到原生全双工（概念图）</title><desc>原生模型取代独立 VAD 和降噪，由模型决定开始回应、继续倾听还是让出话轮。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="400" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">上一代：半双工管线（官方博客描述）</text><rect x="24" y="32" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="84.0" y="57.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">麦克风</text><rect x="172" y="32" width="190" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="267.0" y="57.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">独立 VAD + 传统降噪</text><rect x="390" y="32" width="266" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="523.0" y="57.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">半双工端到端语音模型</text><line x1="144" y1="57" x2="170" y2="57" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="362" y1="57" x2="388" y2="57" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="116" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Seeduplex：一个原生全双工模型</text><rect x="24" y="130" width="120" height="86" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="84.0" y="164.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">持续音频流</text><text x="84.0" y="183.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">边听边说</text><rect x="172" y="130" width="260" height="86" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="302.0" y="164.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">原生全双工模型</text><text x="302.0" y="183.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">基于自研 LLM；声学特征 + 对话上下文</text><line x1="144" y1="173" x2="170" y2="173" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="460" y="130" width="196" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="558.0" y="143.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">开始回应</text><line x1="432" y1="173" x2="458" y2="143" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="460" y="160" width="196" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="558.0" y="173.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">继续倾听</text><line x1="432" y1="173" x2="458" y2="173" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="460" y="190" width="196" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="558.0" y="203.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">让出话轮（被打断）</text><line x1="432" y1="173" x2="458" y2="203" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="248" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">官方强调的两项能力</text><rect x="24" y="262" width="316" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="182.0" y="278.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">抗干扰</text><text x="182.0" y="297.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">区分主说话人、背景噪声、旁人对话</text><rect x="354" y="262" width="302" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="505.0" y="278.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">动态判停</text><text x="505.0" y="297.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">语音 + 语义联合：等犹豫、说完即答</text><text x="24" y="340" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">训练：大规模语音预训练 + 多任务后训练（对话智能、延迟、轮转、抗干扰、定向语音理解）</text><text x="24" y="358" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">推理：投机采样 + 量化。</text><text x="340" y="384" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">官方未公开模型规模、数据量和内部结构；上图只画官方描述的职责划分，不是论文架构图。</text></svg>