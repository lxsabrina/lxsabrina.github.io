<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 498" width="680" height="498" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>FireRedChat voice interaction flow</title><desc>Audio enters pVAD and ASR over RTC; once EoT says the turn ended the dialogue manager runs, calling tools if needed; the LLM response is synthesized by TTS and played back over RTC; barge-in detected by pVAD interrupts the LLM and TTS.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="498" rx="10" fill="#FFFFFF"/><rect x="250" y="32" width="180" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="53.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Client</text><rect x="24" y="90" width="632" height="136" rx="10" fill="#E8F0E4" stroke="#7A9A6E" stroke-width="0.8"/><text x="32" y="214" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Turn-taking controller</text><rect x="40" y="104" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="115.0" y="129.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">pVAD</text><rect x="250" y="164" width="180" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="189.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">ASR</text><rect x="470" y="164" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="545.0" y="189.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">EoT</text><line x1="340" y1="74" x2="340" y2="162" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="348" y="102" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Audio · RTC</text><line x1="340" y1="129" x2="192" y2="129" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><path d="M192 144 L338 144" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="264" y="160" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">timestamp</text><line x1="430" y1="189" x2="468" y2="189" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><path d="M570 164 L570 14 L340 14 L340 30" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="578" y="60" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Not end</text><path d="M545 214 L545 252 L340 252 L340 270" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="553" y="240" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">End</text><rect x="250" y="272" width="180" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340.0" y="294.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Dialogue manager</text><rect x="470" y="272" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="545.0" y="294.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Tools</text><line x1="430" y1="294" x2="468" y2="294" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="340" y1="316" x2="340" y2="344" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="348" y="332" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Tool result</text><rect x="250" y="346" width="180" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="368.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">LLM / Audio LLM</text><line x1="340" y1="390" x2="340" y2="418" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><rect x="250" y="420" width="180" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="440.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">TTS</text><path d="M430 440 L644 440 L644 54 L432 54" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="636" y="320" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">Audio · RTC</text><path d="M115 154 L115 368 L248 368" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><path d="M115 368 L115 440 L248 440" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="122" y="300" font-size="11" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Barge-in</text><text x="24" y="484" font-size="11" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Redrawn from Figure 2 of the paper (see the original for details).</text></svg>