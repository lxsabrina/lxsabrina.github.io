<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>FireRedChat 系统模块</title><desc>客户端通过 RTC 收发音频；轮转控制器包含 pVAD、打断判定和语义判停；交互模块提供级联、半级联和语音到语音三种实现；对话管理器管理历史、提示词和工具。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="380" rx="10" fill="#FFFFFF"/><text x="340" y="16" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">全双工语音交互框架</text><rect x="16" y="32" width="118" height="270" rx="10" fill="#E8F0E4" stroke="#7A9A6E" stroke-width="0.8"/><text x="75.0" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central"></text><text x="75" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">客户端</text><rect x="26" y="70" width="98" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="75.0" y="105.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">录音 / 播放</text><rect x="26" y="152" width="98" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="75.0" y="187.0" font-size="11" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">音频收发</text><rect x="228" y="32" width="142" height="270" rx="10" fill="#E8F0E4" stroke="#7A9A6E" stroke-width="0.8"/><text x="299.0" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central"></text><text x="299" y="52" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">轮转控制</text><rect x="240" y="70" width="118" 