<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 346" width="680" height="346" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>FireRedChat self-hosting in three steps</title><desc>Step 1 WebUI, LiveKit and Redis; step 2 ASR, TTS and your own LLM; step 3 the Agents service.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="346" rx="10" fill="#FFFFFF"/><text x="24" y="18" font-size="13" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">Step 1: base services (docker-compose)</text><rect x="24" y="32" width="150" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="99.0" y="49.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">WebUI</text><text x="99.0" y="68.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">:3000</text><rect x="206" y="32" width="200" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="306.0" y="49.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">LiveKit RTC server</text><text x="306.0" y="68.0" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">:7880; two UDP ports per user</text><rect x="438" y="32" width="218" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="547.0" y="49.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Redis</text><text x="547.0" y="68.0" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">multi-node hosting</text><line x1="174" y1="58" x2="204" y2="58" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="114" font-size="13" fill="#0F6E56" font-weight="500" text-anchor="start" dominant-baseline="central">Step 3: agent service</text><rect x="24" y="128" width="382" height="86" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="215.0" y="162.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Agents bot worker</text><text x="215.0" y="181.0" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">dispatched when a user joins a room; runs pVAD and turn-detector</text><path d="M306 86 L306 126" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="314" y="106" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">audio (RTC)</text><text x="438" y="114" font-size="13" fill="#993C1D" font-weight="500" text-anchor="start" dominant-baseline="central">Step 2: speech and LLM services</text><rect x="438" y="128" width="218" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="547.0" y="146.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">FireRedASR</text><rect x="438" y="170" width="218" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="547.0" y="188.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">FireRedTTS</text><rect x="438" y="212" width="218" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="547.0" y="230.0" font-size="12" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Your LLM: Ollama / vLLM / Dify</text><line x1="406" y1="171" x2="436" y2="146" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="406" y1="171" x2="436" y2="188" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><line x1="406" y1="180" x2="436" y2="230" stroke="#73726C" stroke-width="1.5" marker-end="url(#arr)"/><text x="24" y="270" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">README order: 1) git clone --recurse-submodules, docker-compose up -d;</text><text x="24" y="286" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">2) start ASR, TTS and your own LLM; 3) start the Agents service.</text><text x="24" y="306" font-size="11" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Optional: Nginx for wss / https; open 443 and the UDP media port range (for example 50000-60000).</text><text x="340" y="330" font-size="11" fill="#993C1D" font-weight="400" text-anchor="middle" dominant-baseline="central">Drawn from the repository README; the audio LLM service and context-aware TTS are marked "coming soon" there.</text></svg>