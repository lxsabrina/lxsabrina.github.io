<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>Delivery state and retry: only "not delivered" is safe to repeat</title><desc>Delivery state and retry: only "not delivered" is safe to repeat</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="329" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340.0" y="30" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Delivery state and retry: only "not delivered" is safe to repeat</text>
<text x="60" y="66" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="bold">delivery</text>
<text x="310" y="66" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="bold">meaning</text>
<text x="560" y="66" font-size="11" fill="#2C2C2A" text-anchor="start" font-weight="bold">retry</text>
<rect x="40" y="78" width="600" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340.0" y="101.0" font-size="12" fill="#0F6E56" text-anchor="middle" font-weight="bold"></text>
<text x="60" y="102" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">not_delivered</text>
<text x="310" y="102" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="normal">nothing was sent</text>
<text x="560" y="102" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">safe</text>
<rect x="40" y="124" width="600" height="38" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="340.0" y="147.0" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="bold"></text>
<text x="60" y="148" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">delivered_verified</text>
<text x="310" y="148" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="normal">sent and read back</text>
<text x="560" y="148" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">unsafe</text>
<rect x="40" y="170" width="600" height="38" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="340.0" y="193.0" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="bold"></text>
<text x="60" y="194" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">delivered_unverified</text>
<text x="310" y="194" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="normal">sent, effect not confirmed</text>
<text x="560" y="194" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">unsafe</text>
<rect x="40" y="216" width="600" height="38" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="340.0" y="239.0" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="bold"></text>
<text x="60" y="240" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">delivery_uncertain</text>
<text x="310" y="240" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="normal">may have been sent</text>
<text x="560" y="240" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">unsafe</text>
<rect x="40" y="262" width="600" height="38" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="340.0" y="285.0" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="bold"></text>
<text x="60" y="286" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">unknown</text>
<text x="310" y="286" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="normal">no evidence either way</text>
<text x="560" y="286" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="bold">unsafe*</text>
<text x="340" y="322" font-size="10" fill="#5F5E5A" text-anchor="middle" font-weight="normal">* treat unknown as unsafe: read the current UI state before deciding</text>
</svg>
