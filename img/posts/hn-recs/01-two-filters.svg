<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>同一批评论，两种筛法</title><desc>Hacker News 评论经过两条不同的筛选，一条得到 YouTube 视频合集，另一条得到书单。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="330" rx="10" fill="#FFFFFF"/><rect x="220" y="24" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="340.0" y="43.0" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Hacker News 评论</text><text x="340.0" y="62.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">2007–2026 全量</text><path d="M300 82L170 128" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M380 82L510 128" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="40" y="130" width="260" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="170.0" y="151.0" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">HackerTube</text><text x="170.0" y="170.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">筛出推荐 YouTube 视频的评论</text><rect x="380" y="130" width="260" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="510.0" y="151.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">Hacker Books</text><text x="510.0" y="170.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">筛出提到书的评论</text><path d="M170 192L170 226" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M510 192L510 226" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="40" y="228" width="260" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/><text x="170.0" y="244.0" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">6,454 个视频 · 约 150 个主题</text><text x="170.0" y="263.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">作者自报</text><rect x="380" y="228" width="260" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/><text x="510.0" y="244.0" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">15,766 本书 · 281,363 次提及</text><text x="510.0" y="263.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">站点自报</text><text x="340" y="310" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">两个站点都是个人项目，数字均为各自作者自报。</text></svg>