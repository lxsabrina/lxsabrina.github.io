<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>One comment pool, two filters</title><desc>Hacker News comments pass through two different filters: one yields a YouTube video collection, the other a bookshelf.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="330" rx="10" fill="#FFFFFF"/><rect x="220" y="24" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="340.0" y="43.0" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Hacker News comments</text><text x="340.0" y="62.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">2007–2026, full archive</text><path d="M300 82L170 128" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M380 82L510 128" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="40" y="130" width="260" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="170.0" y="151.0" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">HackerTube</text><text x="170.0" y="170.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">comments recommending a YouTube video</text><rect x="380" y="130" width="260" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="510.0" y="151.0" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">Hacker Books</text><text x="510.0" y="170.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">comments mentioning a book</text><path d="M170 192L170 226" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M510 192L510 226" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="40" y="228" width="260" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/><text x="170.0" y="244.0" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">6,454 videos · about 150 topics</text><text x="170.0" y="263.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">author-reported</text><rect x="380" y="228" width="260" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/><text x="510.0" y="244.0" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">15,766 books · 281,363 mentions</text><text x="510.0" y="263.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">site-reported</text><text x="340" y="310" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Both are personal projects; all figures are reported by their own authors.</text></svg>