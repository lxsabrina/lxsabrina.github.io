<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><title>Hacker Books 的五步流水线</title><desc>从 HN 全量数据到 CSV 导出的五个步骤。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="300" rx="10" fill="#FFFFFF"/><rect x="20" y="40" width="112" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="76.0" y="72.0" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">1 取数据</text><text x="76" y="128" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">公开的 HN 存档</text><path d="M134 72L148 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="150" y="40" width="112" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="206.0" y="72.0" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">2 找候选</text><text x="206" y="128" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">正则 + 轻量 NLP</text><path d="M264 72L278 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="280" y="40" width="112" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="336.0" y="72.0" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">3 对书目</text><text x="336" y="128" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Open Library</text><path d="M394 72L408 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="410" y="40" width="112" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="466.0" y="72.0" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">4 全库计数</text><text x="466" y="128" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">连无链接的也数</text><path d="M524 72L538 72" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="540" y="40" width="112" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="596.0" y="72.0" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">5 模型标注</text><text x="596" y="128" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">四类立场标签</text><rect x="20" y="160" width="640" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/><text x="340" y="185" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">边界情况：书名有歧义（如 Dune、Range）时才调用小模型判断</text><rect x="20" y="226" width="640" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="340.0" y="248.0" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">抽检：400 条与另一模型对比，一致率 85%（模型对模型，不是人工标准）</text></svg>