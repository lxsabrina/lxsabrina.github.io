<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 264" width="680" height="264" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>The runtime check (illustration)</title><desc>An illustration: a tool call passes through LLM value extraction and a Z3 decision before execution</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="263" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="34" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">The runtime check (illustration)</text>
<rect x="20" y="56" width="116" height="70" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="78" y="84" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">1 Agent</text>
<text x="78" y="108" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">candidate call</text>
<line x1="136" y1="91" x2="152" y2="91" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="152" y="56" width="116" height="70" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="210" y="84" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="bold">2 Schema</text>
<text x="210" y="108" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">policy variables</text>
<line x1="268" y1="91" x2="284" y2="91" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="284" y="56" width="116" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="342" y="84" font-size="13" fill="#534AB7" text-anchor="middle" font-weight="bold">3 LLM</text>
<text x="342" y="108" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">from dialogue + args</text>
<line x1="400" y1="91" x2="416" y2="91" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="416" y="56" width="116" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="474" y="84" font-size="13" fill="#0F6E56" text-anchor="middle" font-weight="bold">4 Z3</text>
<text x="474" y="108" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">SAT or UNSAT</text>
<line x1="532" y1="91" x2="548" y2="91" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="548" y="56" width="116" height="70" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="606" y="84" font-size="13" fill="#993C1D" text-anchor="middle" font-weight="bold">5 Verdict</text>
<text x="606" y="108" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">allow or block</text>
<rect x="20" y="150" width="640" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="173" font-size="12" fill="#0F6E56" text-anchor="middle" font-weight="bold">SAT: run the tool</text>
<rect x="20" y="196" width="640" height="48" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="340" y="216" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="bold">UNSAT: block; return the minimal unsat core to the agent to replan</text>
<text x="340" y="234" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">(at most 3 tries, then control goes back to the user)</text>
</svg>