<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="680" height="352" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Realtime-Venus dual loop: real-time front end, asynchronous back end</title><desc>The front-end model listens and speaks at the same time and writes slow work as a private delegation request. The Harness captures the request with an evidence snapshot, routes it to a registered capability, runs it in the background and prepares a reply, which the front end decides when to speak. Task states: queued, running, completed, delivering, delivered.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="352" rx="10" fill="#FFFFFF"/><rect x="24" y="16" width="632" height="116" rx="8" fill="none" stroke="#D3D1C7" stroke-width="1"/><rect x="24" y="192" width="632" height="116" rx="8" fill="none" stroke="#D3D1C7" stroke-width="1"/><text x="40" y="120" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">Real-time loop (front-end model)</text><text x="40" y="296" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">Background loop (Harness)</text><rect x="48" y="34" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="128.0" y="54.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">User speech</text><text x="128.0" y="70.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">continuous input</text><rect x="260" y="34" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="340.0" y="54.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Front-end model</text><text x="340.0" y="70.0" font-size="12" fill="#3C3489" font-weight="400" text-anchor="middle" dominant-baseline="central">listens and speaks</text><rect x="472" y="34" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="552.0" y="54.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Speaks to user</text><text x="552.0" y="70.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">resume or revise</text><rect x="48" y="210" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="128.0" y="230.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Capture request</text><text x="128.0" y="246.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">plus evidence snapshot</text><rect x="260" y="210" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="230.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Route and execute</text><text x="340.0" y="246.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">registered capabilities</text><rect x="472" y="210" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="552.0" y="230.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Prepare reply</text><text x="552.0" y="246.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">waiting to be delivered</text><path d="M208 62H260" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M420 62H472" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M208 238H260" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M420 238H472" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M300 90V172H128V210" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M552 210V90" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="292" y="162" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">delegate (not spoken)</text><text x="544" y="156" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">front end decides when to speak</text><text x="24" y="336" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Task states: Queued → Running → Completed → Delivering → Delivered</text></svg>