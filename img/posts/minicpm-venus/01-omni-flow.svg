<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" width="680" height="304" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>MiniCPM-o 4.5 的单个窗口:先判断听还是说</title><desc>每 1 秒一个窗口。用户音频经 Whisper-medium 流式编码,摄像头画面经 SigLIP 编码,Qwen3-8B 主干读入当前和历史观察,先输出听/说标记;标记为说则生成文字并解码成 24kHz 语音,标记为听则只输出 [listen] 不发声。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="304" rx="10" fill="#FFFFFF"/><rect x="24" y="72" width="136" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="92.0" y="92.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">用户音频</text><text x="92.0" y="108.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">每 1 秒一块</text><rect x="24" y="140" width="136" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="92.0" y="160.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">摄像头画面</text><text x="92.0" y="176.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">可选,448×448</text><rect x="188" y="72" width="136" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="256.0" y="92.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Whisper</text><text x="256.0" y="108.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">medium,流式编码</text><rect x="188" y="140" width="136" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="256.0" y="160.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">SigLIP</text><text x="256.0" y="176.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">视觉编码</text><rect x="352" y="56" width="136" height="152" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="420.0" y="108.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Qwen3-8B 主干</text><text x="420.0" y="124.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">每个窗口读入</text><text x="420.0" y="140.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">当前和历史观察</text><text x="420.0" y="156.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">预测下一段输出</text><rect x="516" y="20" width="136" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="584.0" y="40.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">听/说标记</text><text x="584.0" y="56.0" font-size="12" fill="#3C3489" font-weight="400" text-anchor="middle" dominant-baseline="central">每 1 秒判断一次</text><rect x="516" y="92" width="136" height="72" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="584.0" y="112.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">说</text><text x="584.0" y="128.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">文字 + 语音解码器</text><text x="584.0" y="144.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">输出 24kHz 语音</text><rect x="516" y="180" width="136" height="72" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="584.0" y="200.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">听</text><text x="584.0" y="216.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">输出 [listen]</text><text x="584.0" y="232.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">不发声</text><path d="M160 100H188" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M324 100H352" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M160 168H188" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M324 168H352" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M488 132H502" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M502 48V216" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M502 48H516" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M502 128H516" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M502 216H516" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="24" y="282" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">输入流和输出流并行,互不阻塞;判断在模型内部完成,不依赖外部 VAD</text></svg>