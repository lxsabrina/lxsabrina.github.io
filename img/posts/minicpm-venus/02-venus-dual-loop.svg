<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="680" height="352" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>Realtime-Venus 的双循环:前台实时,后台异步</title><desc>前台模型边听边说,把耗时的事写成一条不朗读的委托请求;后台 Harness 捕获请求并保存证据快照,路由到已注册的能力执行,准备好回复后交给前台,由前台决定何时说。任务状态依次是排队、运行、完成、投递中、已投递。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="352" rx="10" fill="#FFFFFF"/><rect x="24" y="16" width="632" height="116" rx="8" fill="none" stroke="#D3D1C7" stroke-width="1"/><rect x="24" y="192" width="632" height="116" rx="8" fill="none" stroke="#D3D1C7" stroke-width="1"/><text x="40" y="120" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">实时循环(前台模型)</text><text x="40" y="296" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="start" dominant-baseline="central">后台循环(Harness)</text><rect x="48" y="34" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="128.0" y="54.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">用户语音</text><text x="128.0" y="70.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">持续输入</text><rect x="260" y="34" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="340.0" y="54.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">前台模型</text><text x="340.0" y="70.0" font-size="12" fill="#3C3489" font-weight="400" text-anchor="middle" dominant-baseline="central">边听边说</text><rect x="472" y="34" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="552.0" y="54.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">对用户说话</text><text x="552.0" y="70.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">继续、回答或改口</text><rect x="48" y="210" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="128.0" y="230.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">捕获请求</text><text x="128.0" y="246.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">并保存证据快照</text><rect x="260" y="210" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="230.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">路由并执行</text><text x="340.0" y="246.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">已注册的能力</text><rect x="472" y="210" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="552.0" y="230.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">准备回复</text><text x="552.0" y="246.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">等待投递</text><path d="M208 62H260" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M420 62H472" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M208 238H260" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M420 238H472" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M300 90V172H128V210" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M552 210V90" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="292" y="162" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">delegate 请求,不朗读</text><text x="544" y="156" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="end" dominant-baseline="central">由前台决定何时说</text><text x="24" y="336" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">任务状态:排队 → 运行 → 完成 → 投递中 → 已投递</text></svg>