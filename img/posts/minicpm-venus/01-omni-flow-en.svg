<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" width="680" height="304" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><title>One window in MiniCPM-o 4.5: decide to listen or to speak</title><desc>Each 1-second window: user audio goes through the streaming Whisper-medium encoder and camera frames through SigLIP; the Qwen3-8B backbone reads current and past observations and first emits a listen/speak token. On speak it generates text and decodes it to 24 kHz speech; on listen it only emits [listen] and stays silent.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="304" rx="10" fill="#FFFFFF"/><rect x="24" y="72" width="136" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="92.0" y="92.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">User audio</text><text x="92.0" y="108.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">1-second chunks</text><rect x="24" y="140" width="136" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="92.0" y="160.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Camera frames</text><text x="92.0" y="176.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">optional, 448×448</text><rect x="188" y="72" width="136" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="256.0" y="92.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Whisper</text><text x="256.0" y="108.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">medium, streaming</text><rect x="188" y="140" width="136" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="256.0" y="160.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">SigLIP</text><text x="256.0" y="176.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">vision encoder</text><rect x="352" y="56" width="136" height="152" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="420.0" y="92.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Qwen3-8B</text><text x="420.0" y="108.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">backbone</text><text x="420.0" y="124.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">reads current and</text><text x="420.0" y="140.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">past observations</text><text x="420.0" y="156.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">predicts the next</text><text x="420.0" y="172.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">output segment</text><rect x="516" y="20" width="136" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="584.0" y="40.0" font-size="14" fill="#3C3489" font-weight="500" text-anchor="middle" dominant-baseline="central">Listen/speak</text><text x="584.0" y="56.0" font-size="12" fill="#3C3489" font-weight="400" text-anchor="middle" dominant-baseline="central">decided every 1 s</text><rect x="516" y="92" width="136" height="72" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="584.0" y="112.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Speak</text><text x="584.0" y="128.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">text → speech</text><text x="584.0" y="144.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">24 kHz audio out</text><rect x="516" y="180" width="136" height="72" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="584.0" y="200.0" font-size="14" fill="#2C2C2A" font-weight="500" text-anchor="middle" dominant-baseline="central">Listen</text><text x="584.0" y="216.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">emit [listen]</text><text x="584.0" y="232.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">stay silent</text><path d="M160 100H188" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M324 100H352" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M160 168H188" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M324 168H352" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M488 132H502" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M502 48V216" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M502 48H516" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M502 128H516" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M502 216H516" fill="none" stroke="#73726C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="24" y="282" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Input and output streams run in parallel; no external VAD is involved</text></svg>