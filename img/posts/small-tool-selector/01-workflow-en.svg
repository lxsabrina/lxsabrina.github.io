<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>Plan–Retrieve–Select: one small model, two prompts</title><desc>An illustration: the small model splits the instruction into substeps, retrieves once per substep, picks one tool from at most K candidates, and returns the union</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="379" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="34" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Plan–Retrieve–Select: one small model, two prompts</text>
<rect x="20" y="70" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="85.0" y="94.0" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">User instruction</text>
<text x="85.0" y="110.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">e.g. hotel + flight</text>
<line x1="150" y1="98" x2="180" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="182" y="62" width="150" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="257.0" y="86.0" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">Plan (small model)</text>
<text x="257.0" y="102.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">split into n substeps</text>
<text x="257.0" y="118.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">1 call</text>
<line x1="332" y1="98" x2="362" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="364" y="62" width="140" height="72" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="434.0" y="86.0" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Retrieve (BM25)</text>
<text x="434.0" y="102.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">score &gt; τ, keep top K</text>
<text x="434.0" y="118.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">1 per substep, no LLM</text>
<line x1="504" y1="98" x2="528" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="530" y="62" width="135" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="597.5" y="86.0" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">Select (same model)</text>
<text x="597.5" y="102.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">pick 1 of ≤K candidates</text>
<text x="597.5" y="118.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">1 call per substep</text>
<rect x="364" y="170" width="140" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="434.0" y="186.0" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">Tool corpus</text>
<text x="434.0" y="202.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">1,419 to 11K APIs</text>
<line x1="434" y1="170" x2="434" y2="136" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="597" y1="134" x2="597" y2="172" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="530" y="174" width="135" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="597.5" y="196.0" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">Union of picks</text>
<text x="340" y="244" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Every call is stateless: Plan sees the instruction, Select sees one substep + ≤K docs</text>
<text x="340" y="264" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Calls = 1 + n (n ≤ 8); context size does not grow with the corpus</text>
<line x1="30" y1="284" x2="650" y2="284" stroke="#D3D1C7"/>
<text x="40" y="312" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="bold">Training</text>
<rect x="110" y="292" width="230" height="44" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="225.0" y="310.0" font-size="12.5" fill="#993C1D" text-anchor="middle" font-weight="bold">SFT</text>
<text x="225.0" y="326.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">teacher-written trajectories</text>
<line x1="340" y1="314" x2="360" y2="314" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="362" y="292" width="300" height="44" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="512.0" y="310.0" font-size="12.5" fill="#993C1D" text-anchor="middle" font-weight="bold">GRPO</text>
<text x="512.0" y="326.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Plan reward = F1, Select reward = exact match</text>
<text x="340" y="364" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Plan and Select are trained separately; Select trains on teacher-written substeps</text>
</svg>
