<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>Plan–Retrieve–Select：一个小模型，两种提示</title><desc>示意图：小模型先把指令拆成子步骤，每个子步骤检索一次，再从至多 K 个候选里选一个工具，最后取并集</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="379" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="34" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Plan–Retrieve–Select：一个小模型，两种提示</text>
<rect x="20" y="70" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="85.0" y="94.0" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">用户指令</text>
<text x="85.0" y="110.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">例：订酒店 + 订机票</text>
<line x1="150" y1="98" x2="180" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="182" y="62" width="150" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="257.0" y="86.0" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">Plan（小模型）</text>
<text x="257.0" y="102.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">拆成 n 个子步骤</text>
<text x="257.0" y="118.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">1 次调用</text>
<line x1="332" y1="98" x2="362" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="364" y="62" width="140" height="72" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="434.0" y="86.0" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">Retrieve（BM25）</text>
<text x="434.0" y="102.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">分数 &gt; τ，截到前 K</text>
<text x="434.0" y="118.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">每子步骤 1 次，无模型</text>
<line x1="504" y1="98" x2="528" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="530" y="62" width="135" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="597.5" y="86.0" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">Select（同一小模型）</text>
<text x="597.5" y="102.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">从 ≤K 个候选选 1 个</text>
<text x="597.5" y="118.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">每子步骤 1 次调用</text>
<rect x="364" y="170" width="140" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="434.0" y="186.0" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">工具库</text>
<text x="434.0" y="202.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">1,419 到 1.1 万个 API</text>
<line x1="434" y1="170" x2="434" y2="136" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="597" y1="134" x2="597" y2="172" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="530" y="174" width="135" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="597.5" y="196.0" font-size="12.5" fill="#0F6E56" text-anchor="middle" font-weight="bold">工具集合（并集）</text>
<text x="340" y="244" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">每次调用都是无状态的：Plan 只看指令，Select 只看子步骤 + ≤K 份文档</text>
<text x="340" y="264" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="normal">总调用数 = 1 + n（n ≤ 8）；上下文大小与工具库规模无关</text>
<line x1="30" y1="284" x2="650" y2="284" stroke="#D3D1C7"/>
<text x="40" y="312" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="bold">训练</text>
<rect x="110" y="292" width="230" height="44" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="225.0" y="310.0" font-size="12.5" fill="#993C1D" text-anchor="middle" font-weight="bold">SFT</text>
<text x="225.0" y="326.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">教师模型写的轨迹</text>
<line x1="340" y1="314" x2="360" y2="314" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="362" y="292" width="300" height="44" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="512.0" y="310.0" font-size="12.5" fill="#993C1D" text-anchor="middle" font-weight="bold">GRPO</text>
<text x="512.0" y="326.0" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Plan 奖励 = F1，Select 奖励 = 精确匹配</text>
<text x="340" y="364" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Plan / Select 分开训练：训练 Select 时用教师写的子步骤</text>
</svg>
