<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<title>How the Plan reward is computed: a worked example</title><desc>An illustration: two gold tools, three substeps, precision, recall and F1 computed by hand with the paper's definition</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="359" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="340" y="34" font-size="16" fill="#2C2C2A" text-anchor="middle" font-weight="bold">How the Plan reward is computed: a worked example</text>
<text x="340" y="58" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal">Gold tools: book_hotel, book_flight (N = 2)</text>
<rect x="20" y="80" width="145" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="92.5" y="112.0" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">s1 hotel in NYC</text>
<rect x="180" y="92" width="100" height="32" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="230" y="112" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">1. hotel_reviews</text>
<rect x="286" y="92" width="100" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="336" y="112" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">2. book_hotel</text>
<rect x="392" y="92" width="100" height="32" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="442" y="112" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">3. hotel_details</text>
<text x="504" y="112" font-size="11" fill="#534AB7" text-anchor="start" font-weight="normal">→ book_hotel, ρ = 2</text>
<rect x="20" y="146" width="145" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="92.5" y="178.0" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">s2 flight SF to NYC</text>
<rect x="180" y="158" width="100" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="230" y="178" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">1. book_flight</text>
<rect x="286" y="158" width="100" height="32" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="336" y="178" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">2. flight_status</text>
<rect x="392" y="158" width="100" height="32" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="442" y="178" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">3. airport_info</text>
<text x="504" y="178" font-size="11" fill="#534AB7" text-anchor="start" font-weight="normal">→ book_flight, ρ = 1</text>
<rect x="20" y="212" width="145" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="92.5" y="244.0" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="bold">s3 NYC weather</text>
<rect x="180" y="224" width="100" height="32" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="230" y="244" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">1. weather_now</text>
<rect x="286" y="224" width="100" height="32" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="336" y="244" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">2. city_info</text>
<rect x="392" y="224" width="100" height="32" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="442" y="244" font-size="10.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">3. book_hotel</text>
<text x="504" y="244" font-size="11" fill="#993C1D" text-anchor="start" font-weight="normal">unmatched</text>
<text x="340" y="286" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="normal">s3 lists book_hotel, but s1 already matched it, so it does not count again</text>
<rect x="60" y="300" width="560" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="340" y="320" font-size="12.5" fill="#2C2C2A" text-anchor="middle" font-weight="normal">precision = 2/3 ≈ 0.667    recall = (1/2 + 1/1) / 2 = 0.75</text>
<text x="340" y="339" font-size="12.5" fill="#534AB7" text-anchor="middle" font-weight="bold">R_plan = F1 = 2 × 0.667 × 0.75 / (0.667 + 0.75) ≈ 0.71</text>
</svg>
